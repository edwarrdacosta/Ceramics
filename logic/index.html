 ]},

{n:6, title:'Tautology, contradiction, contingency', blurb:'Three kinds of formulas',
 html:`
<p>Look at a formula’s final column and one of three things happens:</p>
<ul>
<li><b>Tautology</b> — true in <b>every</b> row. The formula can’t fail. Example: <span class="formula">P ∨ ¬P</span>.</li>
<li><b>Contradiction</b> — false in every row. It can’t succeed. Example: <span class="formula">P ∧ ¬P</span>.</li>
<li><b>Contingency</b> — true in some rows, false in others. Its value genuinely depends on the facts. Example: <span class="formula">P → Q</span>.</li>
</ul>
<div data-ttable="P ∨ ¬P; P ∧ ¬P; P → Q"></div>
<p>Why care? Tautologies are the <b>laws of logic itself</b> — statements true purely by form. And as you’ll see in Lesson 9, “this argument is valid” secretly means “a certain implication is a tautology”.</p>
<p>The solver classifies every formula you give it: <button class="btn small" data-solve="(P ∧ (P → Q)) → Q">classify a famous tautology</button></p>
<div class="takeaway"><h4>Key idea</h4>Scan the final column: all T ⇒ tautology, all F ⇒ contradiction, mixed ⇒ contingency.</div>`,
 quiz:[
  {q:'P → P is a…',
   choices:[{t:'Tautology'},{t:'Contradiction'},{t:'Contingency'}],
   a:0, explain:'Both rows come out true — a statement always implies itself.'},
  {q:'P ↔ ¬P is a…',
   choices:[{t:'Tautology'},{t:'Contradiction'},{t:'Contingency'}],
   a:1, explain:'A statement never has the same value as its own negation: false in every row.'},
  {q:'(P ∧ Q) → P is a…',
   choices:[{t:'Tautology'},{t:'Contradiction'},{t:'Contingency'}],
   a:0, explain:'If both parts hold, the first certainly holds — true in all four rows.'}
 ]},

{n:7, title:'Equivalence and the laws', blurb:'Rewriting formulas safely',
 html:`
<p>Two formulas are <b>logically equivalent</b> (written <span class="formula">A ≡ B</span>) when they have the <b>same value in every row</b> — they are the same statement in different clothes.</p>
<p>You can verify any equivalence with a truth table, but a small toolbox of laws lets you <b>transform</b> formulas algebraically, step by step — exactly what the Solve tab demonstrates:</p>
` + lawsTableHTML(['Identity','Domination','Idempotence','Double negation','Commutativity','Associativity','Distributivity','De Morgan’s laws','Absorption','Complement','Material implication']) + `
<p>Worked example — watch each law fire: <button class="btn small" data-solve="(P ∧ Q) ∨ (P ∧ ¬Q)">simplify (P ∧ Q) ∨ (P ∧ ¬Q)</button></p>
<div class="mistakebox"><h4>⚠ The De Morgan trap</h4>When a negation moves inside brackets, the connective <b>flips</b>: <span class="formula">¬(A ∧ B) ≡ ¬A ∨ ¬B</span>. Writing <span class="formula">¬A ∧ ¬B</span> instead is the single most common error in this subject. (“Not both” is weaker than “neither”.)</div>
<div class="takeaway"><h4>Key idea</h4>≡ means identical truth-table columns. The laws are pre-verified equivalences you can apply inside any formula, one step at a time.</div>`,
 quiz:[
  {q:'¬(P ∨ Q) is equivalent to…',
   choices:[{t:'¬P ∧ ¬Q'},{t:'¬P ∨ ¬Q', bug:'demorgan-keep-op'},{t:'P ∧ Q'},{t:'¬P ∨ Q', bug:'demorgan-half'}],
   a:0, explain:'“Neither P nor Q”: the ¬ distributes and ∨ flips to ∧.'},
  {q:'P ∨ (P ∧ Q) simplifies to…',
   choices:[{t:'P'},{t:'Q', bug:'absorb-wrong'},{t:'P ∧ Q'},{t:'⊤'}],
   a:0, explain:'Absorption: the inner P ∧ Q can only be true when P already is.'},
  {q:'P → Q is equivalent to…',
   choices:[{t:'¬P ∨ Q'},{t:'P ∨ Q', bug:'imp-as-or'},{t:'¬P ∨ ¬Q', bug:'imp-elim-both-neg'},{t:'P ∧ Q', bug:'imp-as-and'}],
   a:0, explain:'Material implication: either the if-part fails (¬P) or the then-part holds (Q).'}
 ]},

{n:8, title:'Converse, inverse, contrapositive', blurb:'The conditional’s family',
 html:`
<p>Every conditional <span class="formula">A → B</span> has three relatives — and knowing which are equivalent prevents whole families of mistakes:</p>
<table class="lawtable"><tr><th>Name</th><th>Form</th><th>Equivalent to original?</th></tr>
<tr><td>Original</td><td class="formula">A → B</td><td>—</td></tr>
<tr><td><b>Contrapositive</b></td><td class="formula">¬B → ¬A</td><td><b>Yes ✓</b></td></tr>
<tr><td>Converse</td><td class="formula">B → A</td><td>No</td></tr>
<tr><td>Inverse</td><td class="formula">¬A → ¬B</td><td>No (but ≡ converse)</td></tr></table>
<p>See it in the table — original and contrapositive match column-for-column; the converse doesn’t:</p>
<div data-ttable="P → Q; ¬Q → ¬P; Q → P"></div>
<p>“If it’s a dog, it’s a mammal” guarantees “if it’s not a mammal, it’s not a dog” (contrapositive) — but certainly not “if it’s a mammal, it’s a dog” (converse).</p>
<h3>Negating a conditional</h3>
<p>To deny a promise you must catch it being broken: if-part true, then-part false.</p>
<p style="text-align:center" class="formula"><b>¬(A → B) ≡ A ∧ ¬B</b></p>
<div class="mistakebox"><h4>⚠ Trap</h4>The negation of an implication is <b>not</b> another implication. ¬(A → B) is the AND-statement A ∧ ¬B — verify: <button class="btn small" data-solve="¬(P → Q) == P ∧ ¬Q">check in solver</button></div>
<div class="takeaway"><h4>Key idea</h4>Contrapositive = flip AND negate = same statement. Converse/inverse = different statements. Negating A → B gives A ∧ ¬B.</div>`,
 quiz:[
  {q:'The contrapositive of “If it rains (R), the street gets wet (W)” is…',
   choices:[{t:'If the street isn’t wet, it isn’t raining (¬W → ¬R)'},{t:'If the street is wet, it rained (W → R)', bug:'converse'},{t:'If it doesn’t rain, the street isn’t wet (¬R → ¬W)', bug:'inverse'}],
   a:0, explain:'Swap and negate both parts: ¬W → ¬R. The other two are converse and inverse — not equivalent.'},
  {q:'¬(P → Q) is equivalent to…',
   choices:[{t:'P ∧ ¬Q'},{t:'¬P → ¬Q', bug:'neg-imp-as-imp'},{t:'P → ¬Q', bug:'neg-imp-as-imp'},{t:'¬P ∨ Q'}],
   a:0, explain:'A broken promise: P happened and Q didn’t.'},
  {q:'Which statement is equivalent to A → B?',
   choices:[{t:'¬B → ¬A'},{t:'B → A', bug:'converse'},{t:'¬A → ¬B', bug:'inverse'}],
   a:0, explain:'Only the contrapositive survives the truth-table test.'}
 ]},

{n:9, title:'Arguments and validity', blurb:'Where logic earns its keep',
 html:`
<p>An <b>argument</b> is a list of <b>premises</b> plus a <b>conclusion</b>, written <span class="formula">P₁, P₂, … ⊢ C</span>. It is <b>valid</b> when the conclusion cannot fail while the premises hold — i.e. <b>no row</b> of the truth table makes every premise true and the conclusion false.</p>
<p>Validity is about <i>form</i>, not facts. A valid argument with false premises proves nothing about the world — but its form is still airtight.</p>
<h3>Forms worth knowing by name</h3>
<table class="lawtable"><tr><th>Valid ✓</th><th>Invalid ✗ (fallacy)</th></tr>
<tr><td class="formula">A → B, A ⊢ B<br><span class="muted">modus ponens</span></td>
    <td class="formula">A → B, B ⊢ A<br><span class="muted">affirming the consequent</span></td></tr>
<tr><td class="formula">A → B, ¬B ⊢ ¬A<br><span class="muted">modus tollens</span></td>
    <td class="formula">A → B, ¬A ⊢ ¬B<br><span class="muted">denying the antecedent</span></td></tr>
<tr><td class="formula">A ∨ B, ¬A ⊢ B<br><span class="muted">disjunctive syllogism</span></td>
    <td class="formula">A ∨ B, A ⊢ ¬B<br><span class="muted">“or” is not exclusive!</span></td></tr>
<tr><td class="formula">A → B, B → C ⊢ A → C<br><span class="muted">hypothetical syllogism</span></td><td></td></tr></table>
<p>“If it’s raining the street is wet; the street is wet; therefore it’s raining” — tempting, and <b>wrong</b>: a street-cleaning truck is a counterexample. That is affirming the consequent.</p>
<p>The solver checks any argument and hunts for counterexample rows: <button class="btn small" data-solve="P → Q, Q ⊢ P">test the fallacy</button> <button class="btn small" data-solve="P → Q, P ⊢ Q">test modus ponens</button></p>
<div class="takeaway"><h4>Key idea</h4>Valid = no counterexample row. To attack an argument, look for one row: all premises T, conclusion F. One such row settles it.</div>`,
 quiz:[
  {q:'“P → Q, P, therefore Q” is…',
   choices:[{t:'Valid (modus ponens)'},{t:'Invalid'}],
   a:0, explain:'The classic: if the implication and its if-part both hold, the then-part must.'},
  {q:'“P → Q, Q, therefore P” is…',
   choices:[{t:'Valid'},{t:'Invalid — Q may hold for other reasons', bug:'affirming-consequent'}],
   a:1, explain:'Affirming the consequent. Row P=F, Q=T: both premises true, conclusion false.', flip:true},
  {q:'“P → Q, ¬P, therefore ¬Q” is…',
   choices:[{t:'Valid', bug:'denying-antecedent'},{t:'Invalid'}],
   a:1, explain:'Denying the antecedent. When P is false the implication says nothing about Q.'}
 ]},

{n:10, title:'Normal forms (NNF · CNF · DNF)', blurb:'Standard shapes for formulas',
 html:`
<p>Any formula can be rewritten into a <b>standard shape</b>. Three matter most:</p>
<ul>
<li><b>NNF</b> — negation normal form: only ∧, ∨ and ¬, with every ¬ sitting directly on a letter.</li>
<li><b>CNF</b> — conjunctive normal form: an <b>AND of OR-clauses</b>, e.g. <span class="formula">(P ∨ ¬Q) ∧ (¬P ∨ R)</span>. This is the input format of SAT solvers.</li>
<li><b>DNF</b> — disjunctive normal form: an <b>OR of AND-terms</b>, e.g. <span class="formula">(P ∧ Q) ∨ (¬P ∧ R)</span>. You can read a DNF straight off the true rows of a truth table.</li>
</ul>
<h3>The recipe</h3>
<ol>
<li>Expand <span class="formula">↔</span> and <span class="formula">⊕</span>, then eliminate <span class="formula">→</span> (material implication).</li>
<li>Push every ¬ inwards with De Morgan; cancel double negations. (Now you have NNF.)</li>
<li>Distribute: ∨ over ∧ for CNF, ∧ over ∨ for DNF. Simplify constants as you go.</li>
</ol>
<p>The Solve tab performs each recipe and shows every step with the law used:</p>
<p><button class="btn small" data-solve="¬(P → Q) ∨ R" data-mode="nnf">to NNF</button>
<button class="btn small" data-solve="P ↔ Q" data-mode="cnf">P ↔ Q to CNF</button>
<button class="btn small" data-solve="P ↔ Q" data-mode="dnf">P ↔ Q to DNF</button></p>
<div class="takeaway"><h4>Key idea</h4>Normal forms trade prettiness for predictability — fixed shapes that algorithms (and humans) can process systematically.</div>`,
 quiz:[
  {q:'Which formula is in CNF?',
   choices:[{t:'(P ∨ Q) ∧ (¬P ∨ R)'},{t:'¬(P ∨ Q) ∧ R'},{t:'(P ∧ Q) ∨ (P ∧ R)'},{t:'P → (Q ∧ R)'}],
   a:0, explain:'CNF = AND of OR-clauses of literals. The second has ¬ on a bracket, the third is DNF, the fourth still has →.'},
  {q:'In negation normal form, ¬ may appear…',
   choices:[{t:'only directly on statement letters'},{t:'anywhere'},{t:'nowhere at all'}],
   a:0, explain:'NNF allows literals like ¬P, but no negated brackets like ¬(P ∧ Q).'},
  {q:'A formula true ONLY in the row P=T, Q=F has which DNF?',
   choices:[{t:'P ∧ ¬Q'},{t:'P ∨ ¬Q'},{t:'¬P ∧ Q'}],
   a:0, explain:'Each true row becomes one AND-term describing that row exactly.'}
 ]}
];

/* ─────────────────────── 10 · Public API (used by tests) ─────────────────────── */

const LogicLab={
  A,K,N,B, eq, clone, nodeCount, prec, format, formatHTML, esc,
  LogicError, tokenize, parseInput, parseFormula,
  evl, atomList, rowsFor, subformulas, classify, equivalent, counterexamples,
  argumentCheck, MODELS, evlModel, usesOp,
  RULES, MODES, derive, applyFirst, isCNF, isDNF, isNNF, isLit,
  BUGS, FALLACIES, mistakeInfo, variantsAt, diagnose,
  ttableHTML, evalWalkHTML, lawsTableHTML,
  SIMPLIFY_TEMPLATES, EVAL_EXPRS, TABLE_EXPRS, LAW_INSTANCES, ARG_TEMPLATES,
  EXERCISE_TYPES, genExercise, renameAtoms,
  gradeSimplify, gradeEvaluate, gradeTable, gradeLaw, gradeArgument, smartPick,
  LESSONS, LAWS_REF
};
if(typeof globalThis!=='undefined') globalThis.LogicLab=LogicLab;

/* ═══════════════════════════ 11 · UI (browser only) ═══════════════════════════ */

if(typeof document!=='undefined'){ (function(){

  /* ---------- persistent state ---------- */
  const KEY='logiclab-v1';
  function freshState(){ return {lessons:{}, stats:{}, mistakes:{}, view:null, lesson:1}; }
  function loadState(){
    try{ return Object.assign(freshState(), JSON.parse(localStorage.getItem(KEY)||'{}')); }
    catch(e){ return freshState(); }
  }
  let S=loadState();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function recordStat(type, correct){
    const s=S.stats[type]||(S.stats[type]={n:0,c:0});
    s.n++; if(correct) s.c++; save();
  }
  function recordMistakes(ids){
    for(const id of ids||[]){
      const m=S.mistakes[id]||(S.mistakes[id]={n:0});
      m.n++; m.last=Date.now();
    }
    if(ids&&ids.length) save();
  }
  function topMistake(){
    let best=null;
    for(const id of Object.keys(S.mistakes)){
      if(S.mistakes[id].n>=2 && (!best||S.mistakes[id].n>S.mistakes[best].n)) best=id;
    }
    return best;
  }

  /* ---------- small helpers ---------- */
  const $=s=>document.querySelector(s);
  function insertAtCursor(input, text){
    const st=input.selectionStart??input.value.length, en=input.selectionEnd??st;
    input.value=input.value.slice(0,st)+text+input.value.slice(en);
    input.focus();
    const p=st+text.length;
    input.setSelectionRange(p,p);
  }
  const PALETTE=[['¬','not'],['∧','and'],['∨','or'],['→','if-then'],['↔','iff'],['⊕','xor'],
                 ['⊤','true'],['⊥','false'],['(',''],[')',''],['≡','same as'],['⊢','therefore'],[',','']];
  function paletteHTML(forId){
    return '<div class="palette">'+PALETTE.map(([sym,lbl])=>
      `<button type="button" data-ins="${esc(sym)}" data-for="${forId}">${esc(sym)}${lbl?`<span class="plbl">${esc(lbl)}</span>`:''}</button>`
    ).join('')+'</div>';
  }
  let ttFocus=null; // last focused input in the truth-table view
  document.addEventListener('click', e=>{
    const ins=e.target.closest('[data-ins]');
    if(ins){
      const id=ins.dataset.for;
      const input = id==='@tables' ? (ttFocus||$('#tt-1')) : document.getElementById(id);
      if(input) insertAtCursor(input, ins.dataset.ins);
      return;
    }
    const sol=e.target.closest('[data-solve]');
    if(sol){
      $('#solve-input').value=sol.dataset.solve;
      if(sol.dataset.mode) $('#solve-mode').value=sol.dataset.mode;
      location.hash='solve';
      runSolve();
      return;
    }
    const pb=e.target.closest('[data-practice-bug]');
    if(pb){ startTargetedPractice(pb.dataset.practiceBug); }
  });
  function errorHTML(src, e){
    let h='<div class="feedback bad"><h4>Hmm — I can’t read that yet</h4><p>'+esc(e.message)+'</p>';
    if(typeof e.pos==='number' && src)
      h+='<pre class="err-echo">'+esc(src)+'\n'+' '.repeat(Math.min(e.pos,src.length))+'▲</pre>';
    return h+'</div>';
  }
  function verdictChip(v){
    if(v==='tautology') return '<span class="chip good">tautology — always true</span>';
    if(v==='contradiction') return '<span class="chip bad">contradiction — never true</span>';
    return '<span class="chip neutral">contingency — depends on the letters</span>';
  }

  /* ---------- Solve view ---------- */
  const SOLVE_EXAMPLES=['¬(P ∧ (Q ∨ ¬P))','(P ∧ Q) ∨ (P ∧ ¬Q)','¬(P → Q)','P ↔ Q',
    '(P ∨ Q) ∧ (P ∨ ¬Q) ∧ ⊤','P → Q == ¬Q → ¬P','¬(P ∨ Q) == ¬P ∨ ¬Q',
    'P → Q, P ⊢ Q','P → Q, Q ⊢ P','P ∨ Q, ¬P ⊢ Q'];
  function initSolve(){
    $('#view-solve').innerHTML=`
    <div class="card">
      <h2>Step-by-step solver</h2>
      <p class="muted small">Enter a <b>formula</b> to simplify it law by law · an <b>equivalence claim</b> with <span class="kbd">==</span> or <span class="kbd">≡</span> to prove or refute it · or an <b>argument</b> like <span class="kbd">P → Q, P ⊢ Q</span> to test validity. Plain typing works: <span class="kbd">~ & | -> &lt;-&gt; T F</span></p>
      <div class="row">
        <div class="grow"><input type="text" id="solve-input" placeholder="e.g.  ~(P & Q) -> R     or     P -> Q == ~Q -> ~P" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <select id="solve-mode" title="What to do with a single formula">
          ${Object.entries(MODES).map(([k,m])=>`<option value="${k}">${esc(m.label)}</option>`).join('')}
        </select>
        <button class="btn primary" id="solve-go">Solve</button>
      </div>
      ${paletteHTML('solve-input')}
      <div class="row" style="margin-top:10px">
        <label class="lbl" for="solve-ex">Try an example</label>
        <select id="solve-ex"><option value="">choose…</option>
          ${SOLVE_EXAMPLES.map(x=>`<option>${esc(x)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="solve-out"></div>`;
    $('#solve-go').addEventListener('click', runSolve);
    $('#solve-input').addEventListener('keydown', e=>{ if(e.key==='Enter') runSolve(); });
    $('#solve-ex').addEventListener('change', e=>{
      if(e.target.value){ $('#solve-input').value=e.target.value; runSolve(); e.target.value=''; }
    });
  }
  function stepsHTML(start, steps){
    let h='<ol class="steps">';
    h+='<li><span class="num">·</span><span class="formula">'+formatHTML(start,null)+'</span></li>';
    steps.forEach((st,i)=>{
      h+='<li><span class="num">'+(i+1)+'</span><span class="formula">'+formatHTML(st.after, st.focusA)+'</span>'+
         '<span class="why"><span class="law-badge">'+esc(st.rule.name)+'</span>'+esc(st.rule.why)+'</span></li>';
    });
    return h+'</ol>';
  }
  function tableOrNote(asts, opts){
    const n=atomList(...asts).length;
    if(n>6) return '<p class="muted small">Truth table hidden — '+n+' letters would need '+(1<<n)+' rows.</p>';
    return ttableHTML(asts, opts);
  }
  function formulaReport(ast, mode){
    const cls=classify(ast);
    const der=derive(ast, mode);
    let h='<div class="card"><h2>'+esc(MODES[mode].label)+'</h2>';
    h+='<p><span class="bigformula">'+esc(format(ast))+'</span></p>';
    h+='<p>'+verdictChip(cls.verdict)+' <span class="chip neutral">true in '+cls.trueCount+' of '+cls.total+' rows</span></p>';
    h+='<p class="muted small">'+esc(MODES[mode].desc)+'</p><hr>';
    if(!der.steps.length){
      h+='<p><b>No rule applies</b> — the formula is already as reduced as this mode can make it. ✓</p>';
    } else {
      h+='<h3>Derivation — '+der.steps.length+' step'+(der.steps.length>1?'s':'')+'</h3>';
      h+='<p class="muted small">Each line highlights the part that just changed; the badge names the law that licensed it. Every step preserves logical equivalence.</p>';
      h+=stepsHTML(ast, der.steps);
      if(der.truncated) h+='<p class="muted small">⚠ Stopped after '+der.steps.length+' steps — the full derivation is longer.</p>';
      let shape='';
      if(mode==='cnf'&&isCNF(der.result)) shape=' <span class="chip good">CNF ✓</span>';
      if(mode==='dnf'&&isDNF(der.result)) shape=' <span class="chip good">DNF ✓</span>';
      if(mode==='nnf'&&isNNF(der.result)) shape=' <span class="chip good">NNF ✓</span>';
      h+='<p>Result: <span class="bigformula">'+esc(format(der.result))+'</span>'+shape+'</p>';
    }
    h+='<details><summary>Truth table with working columns</summary>'+
       tableOrNote([ast],{subcols:true})+
       '<p class="muted small">Columns build left to right, smallest parts first — exactly how you would fill it in by hand.</p></details>';
    return h+'</div>';
  }
  function equivReport(l, r){
    const ok=equivalent(l,r);
    const rows=1<<atomList(l,r).length;
    let h='<div class="card"><h2>Equivalence check</h2>';
    h+='<p><span class="bigformula">'+esc(format(l))+'</span> &nbsp;≡?&nbsp; <span class="bigformula">'+esc(format(r))+'</span></p>';
    if(ok){
      h+='<p><span class="chip good">EQUIVALENT ✓</span> — identical values in all '+rows+' rows.</p>';
      h+=tableOrNote([l,r]);
      const dl=derive(l,'simplify'), dr=derive(r,'simplify');
      if(dl.steps.length||dr.steps.length){
        h+='<details><summary>Watch both sides simplify</summary><div class="cols2">';
        h+='<div><h3 class="small">Left side</h3>'+(dl.steps.length?stepsHTML(l,dl.steps):'<p class="muted small">already minimal</p>')+'</div>';
        h+='<div><h3 class="small">Right side</h3>'+(dr.steps.length?stepsHTML(r,dr.steps):'<p class="muted small">already minimal</p>')+'</div>';
        h+='</div></details>';
      }
    } else {
      const ces=counterexamples(l,r,3);
      const atoms=atomList(l,r);
      h+='<p><span class="chip bad">NOT EQUIVALENT ✗</span></p><p>They disagree — for example:</p><ul>';
      for(const ce of ces)
        h+='<li class="small">'+esc(envSentence(ce.env,atoms))+' → left is <b>'+(ce.vx?'T':'F')+'</b>, right is <b>'+(ce.vy?'T':'F')+'</b></li>';
      h+='</ul>'+tableOrNote([l,r],{hlPred:env=>evl(l,env)!==evl(r,env)});
      h+='<p class="muted small">Highlighted rows are where the two formulas disagree.</p>';
    }
    return h+'</div>';
  }
  function argumentReport(premises, conclusion){
    const res=argumentCheck(premises, conclusion);
    let h='<div class="card"><h2>Argument check</h2>';
    h+='<p><span class="bigformula">'+premises.map(p=>esc(format(p))).join(' ,&nbsp; ')+' &nbsp;⊢&nbsp; '+esc(format(conclusion))+'</span></p>';
    if(res.valid){
      h+='<p><span class="chip good">VALID ✓</span> — no row makes every premise true and the conclusion false.</p>';
      h+=tableOrNote([...premises, conclusion],{hlPred:env=>premises.every(p=>evl(p,env))});
      h+='<p class="muted small">Highlighted rows: all premises true. Check the conclusion column there — always T.</p>';
    } else {
      h+='<p><span class="chip bad">INVALID ✗</span> — found '+res.counterexamples.length+' counterexample row'+(res.counterexamples.length>1?'s':'')+':</p><ul>';
      for(const env of res.counterexamples.slice(0,3))
        h+='<li class="small">'+esc(envSentence(env,res.atoms))+' — premises all true, conclusion false</li>';
      h+='</ul>'+tableOrNote([...premises, conclusion],{hlPred:env=>premises.every(p=>evl(p,env))&&!evl(conclusion,env)});
      h+='<p class="muted small">Highlighted rows are the counterexamples.</p>';
    }
    return h+'</div>';
  }
  function runSolve(){
    const src=$('#solve-input').value.trim();
    const out=$('#solve-out');
    if(!src){ out.innerHTML=''; return; }
    let parsed;
    try{ parsed=parseInput(src); }
    catch(e){ out.innerHTML=errorHTML(src,e); return; }
    if(parsed.kind==='formula') out.innerHTML=formulaReport(parsed.ast, $('#solve-mode').value);
    else if(parsed.kind==='equiv') out.innerHTML=equivReport(parsed.left, parsed.right);
    else out.innerHTML=argumentReport(parsed.premises, parsed.conclusion);
  }

  /* ---------- Truth-table view ---------- */
  function initTables(){
    $('#view-tables').innerHTML=`
    <div class="card">
      <h2>Truth-table builder</h2>
      <p class="muted small">Build the table for one formula — or several at once to compare them column by column.</p>
      <div class="row"><div class="grow"><input type="text" id="tt-1" placeholder="first formula, e.g.  P -> Q" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
      <div class="row" style="margin-top:6px"><div class="grow"><input type="text" id="tt-2" placeholder="second formula (optional), e.g.  ~P | Q" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
      <div class="row" style="margin-top:6px"><div class="grow"><input type="text" id="tt-3" placeholder="third formula (optional)" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
      ${paletteHTML('@tables')}
      <div class="row" style="margin-top:10px">
        <label class="small"><input type="checkbox" id="tt-sub" checked> show working columns (sub-formulas)</label>
        <button class="btn primary" id="tt-go">Build table</button>
      </div>
    </div>
    <div id="tt-out"></div>`;
    ['tt-1','tt-2','tt-3'].forEach(id=>{
      const inp=document.getElementById(id);
      inp.addEventListener('focusin', ()=>{ ttFocus=inp; });
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') buildTables(); });
    });
    $('#tt-go').addEventListener('click', buildTables);
  }
  function buildTables(){
    const out=$('#tt-out');
    const srcs=['tt-1','tt-2','tt-3'].map(id=>document.getElementById(id).value.trim()).filter(Boolean);
    if(!srcs.length){ out.innerHTML='<div class="feedback info"><p>Type at least one formula above.</p></div>'; return; }
    const asts=[];
    for(const s of srcs){
      try{ asts.push(parseFormula(s)); }
      catch(e){ out.innerHTML=errorHTML(s,e); return; }
    }
    const sub=$('#tt-sub').checked && asts.length===1;
    let h='<div class="card"><h2>Truth table</h2>';
    const n=atomList(...asts).length;
    if(n>6){ h+='<p class="muted">That needs '+(1<<n)+' rows — try at most 6 distinct letters.</p></div>'; out.innerHTML=h; return; }
    h+=ttableHTML(asts,{subcols:sub});
    if(asts.length===1){
      const cls=classify(asts[0]);
      h+='<p>'+verdictChip(cls.verdict)+'</p>';
    }
    if(asts.length>1){
      h+='<h3>Comparisons</h3><p class="row tight">';
      for(let i=0;i<asts.length;i++) for(let j=i+1;j<asts.length;j++){
        const okij=equivalent(asts[i],asts[j]);
        const diff=counterexamples(asts[i],asts[j],99).length;
        h+= okij
          ? '<span class="chip good">'+esc(format(asts[i]))+' ≡ '+esc(format(asts[j]))+' ✓</span> '
          : '<span class="chip bad">'+esc(format(asts[i]))+' ≢ '+esc(format(asts[j]))+' (differs in '+diff+' row'+(diff>1?'s':'')+')</span> ';
      }
      h+='</p>';
    }
    out.innerHTML=h+'</div>';
  }

  /* ---------- Practice view ---------- */
  const P={mode:'smart', forceTag:null, ex:null, locked:false, session:{n:0,c:0}};
  function initPractice(){
    $('#view-practice').innerHTML=`
    <div class="card">
      <div class="scorebar">
        <h2 style="margin:0">Practice</h2>
        <span class="chip neutral" id="prac-score">0 / 0 this session</span>
        <button class="btn small" id="prac-skip">Skip → new question</button>
      </div>
      <div class="row tight" style="margin-top:8px" id="prac-modes">
        <button class="btn small" data-pmode="smart">★ Smart practice</button>
        ${Object.entries(EXERCISE_TYPES).map(([k,v])=>`<button class="btn small" data-pmode="${k}">${esc(v)}</button>`).join('')}
      </div>
      <p class="muted small">Smart practice watches your accuracy and recurring mistakes, then serves what you need most.</p>
      <div id="prac-target"></div>
      <div id="prac-q"></div>
      <div id="prac-fb"></div>
    </div>`;
    $('#prac-modes').addEventListener('click', e=>{
      const b=e.target.closest('[data-pmode]');
      if(b){ P.mode=b.dataset.pmode; P.forceTag=null; markMode(); newQuestion(); }
    });
    $('#prac-skip').addEventListener('click', newQuestion);
    markMode();
  }
  function markMode(){
    document.querySelectorAll('#prac-modes [data-pmode]').forEach(b=>{
      b.classList.toggle('primary', b.dataset.pmode===P.mode);
    });
  }
  function updateScore(){
    $('#prac-score').textContent=P.session.c+' / '+P.session.n+' this session';
  }
  function startTargetedPractice(bugId){
    const info=mistakeInfo(bugId);
    if(info.practice){ P.mode=info.practice.type; P.forceTag=info.practice.tag||null; }
    else { P.mode='smart'; P.forceTag=null; }
    location.hash='practice';
    markMode();
    newQuestion(info);
  }
  function newQuestion(targetInfo){
    P.locked=false;
    $('#prac-fb').innerHTML='';
    let type=P.mode, tag=P.forceTag, banner=targetInfo&&targetInfo.name?targetInfo:null;
    if(P.mode==='smart'){
      const sel=smartPick(S.stats, topMistake());
      type=sel.type; tag=sel.tag;
      if(sel.targeted) banner=sel.targeted;
    }
    $('#prac-target').innerHTML = banner
      ? '<p><span class="chip warn">targeting: '+esc(banner.name)+'</span></p>' : '';
    P.ex=genExercise(type, {tag});
    renderExercise(P.ex);
  }
  function finishQuestion(res){
    if(res.retry){
      $('#prac-fb').innerHTML='<div class="feedback info">'+res.html+'</div>';
      return;
    }
    P.locked=true;
    P.session.n++; if(res.correct) P.session.c++;
    updateScore();
    recordStat(P.ex.type, res.correct);
    recordMistakes(res.bugs);
    $('#prac-fb').innerHTML='<div class="feedback '+(res.correct?'good':'bad')+'">'+res.html+'</div>'+
      '<p><button class="btn primary" id="prac-next">Next question →</button></p>';
    $('#prac-next').addEventListener('click', ()=>newQuestion());
    $('#prac-next').focus();
  }
  function renderExercise(ex){
    const q=$('#prac-q');
    if(ex.type==='simplify'){
      q.innerHTML='<h3>'+esc(ex.prompt)+'</h3>'+
        '<p><span class="bigformula">'+esc(format(ex.give))+'</span></p>'+
        '<div class="row"><div class="grow"><input type="text" id="prac-input" placeholder="your formula…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
        '<button class="btn primary" id="prac-check">Check</button>'+
        '<button class="btn" id="prac-reveal">Show answer</button></div>'+
        paletteHTML('prac-input');
      $('#prac-check').addEventListener('click', ()=>{
        if(P.locked) return;
        finishQuestion(gradeSimplify(ex, $('#prac-input').value.trim()));
      });
      $('#prac-input').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!P.locked) $('#prac-check').click(); });
      $('#prac-reveal').addEventListener('click', ()=>{
        if(P.locked) return;
        finishQuestion({correct:false, bugs:[], html:
          '<p>The answer is <span class="formula"><b>'+esc(format(ex.want))+'</b></span>.</p>'+
          '<p class="muted small">No worries — seeing worked answers is studying too. This pattern will come back.</p>'});
      });
      $('#prac-input').focus();
    }
    else if(ex.type==='evaluate'){
      q.innerHTML='<h3>Evaluate the formula under this assignment</h3>'+
        '<p><span class="bigformula">'+esc(format(ex.ast))+'</span></p>'+
        '<div class="envchips">'+ex.atoms.map(a=>'<span class="envchip">'+esc(a)+' = '+(ex.env[a]?'T':'F')+'</span>').join('')+'</div>'+
        '<div class="tfbtns"><button data-tf="T">T</button><button data-tf="F">F</button></div>';
      q.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click', ()=>{
        if(P.locked) return;
        const ans=b.dataset.tf==='T';
        const res=gradeEvaluate(ex, ans);
        b.classList.add(res.correct?'correct':'wrong');
        q.querySelectorAll('[data-tf]').forEach(x=>{
          x.disabled=true;
          if((x.dataset.tf==='T')===ex.truth) x.classList.add('correct');
        });
        finishQuestion(res);
      }));
    }
    else if(ex.type==='table'){
      let rowsH='';
      ex.rows.forEach((env,i)=>{
        rowsH+='<tr>'+ex.atoms.map(a=>tv(env[a])).join('')+
          '<td><select class="tt-select" data-row="'+i+'"><option value="">?</option><option value="T">T</option><option value="F">F</option></select></td></tr>';
      });
      q.innerHTML='<h3>Fill in the final column</h3>'+
        '<p><span class="bigformula">'+esc(format(ex.ast))+'</span></p>'+
        '<div class="tt-scroll"><table class="ttable"><tr>'+ex.atoms.map(a=>'<th>'+esc(a)+'</th>').join('')+
        '<th>'+esc(format(ex.ast))+'</th></tr>'+rowsH+'</table></div>'+
        '<p><button class="btn primary" id="prac-check">Check column</button></p>';
      $('#prac-check').addEventListener('click', ()=>{
        if(P.locked) return;
        const sels=[...q.querySelectorAll('select[data-row]')];
        if(sels.some(s=>!s.value)){
          $('#prac-fb').innerHTML='<div class="feedback info"><p>Fill in every row first (T or F).</p></div>';
          return;
        }
        const cells=sels.map(s=>s.value==='T');
        const res=gradeTable(ex, cells);
        sels.forEach((s,i)=>{
          s.disabled=true;
          s.classList.add(cells[i]===ex.truthCol[i]?'cellok':'cellbad');
        });
        finishQuestion(res);
      });
    }
    else if(ex.type==='law'){
      q.innerHTML='<h3>Which law justifies this rewrite?</h3>'+
        '<p><span class="bigformula">'+esc(ex.inst.from)+'</span> &nbsp;⟿&nbsp; <span class="bigformula">'+esc(ex.inst.to)+'</span></p>'+
        '<div class="choices">'+ex.options.map((o,i)=>'<button data-c="'+i+'">'+esc(o)+'</button>').join('')+'</div>';
      q.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click', ()=>{
        if(P.locked) return;
        const i=+b.dataset.c;
        const res=gradeLaw(ex, i);
        q.querySelectorAll('[data-c]').forEach(x=>{
          x.disabled=true;
          if(+x.dataset.c===ex.answer) x.classList.add('correct');
        });
        if(!res.correct) b.classList.add('wrong');
        finishQuestion(res);
      }));
    }
    else if(ex.type==='argument'){
      q.innerHTML='<h3>Valid or invalid?</h3>'+
        '<p><span class="bigformula">'+ex.premises.map(p=>esc(format(p))).join(' ,&nbsp; ')+' &nbsp;⊢&nbsp; '+esc(format(ex.conclusion))+'</span></p>'+
        '<p class="muted small">Valid = no possible row makes all premises true and the conclusion false.</p>'+
        '<div class="choices"><button data-v="1">Valid — the conclusion must follow</button>'+
        '<button data-v="0">Invalid — a counterexample exists</button></div>';
      q.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click', ()=>{
        if(P.locked) return;
        const says=b.dataset.v==='1';
        const res=gradeArgument(ex, says);
        q.querySelectorAll('[data-v]').forEach(x=>{
          x.disabled=true;
          if((x.dataset.v==='1')===ex.valid) x.classList.add('correct');
        });
        if(!res.correct) b.classList.add('wrong');
        finishQuestion(res);
      }));
    }
  }

  /* ---------- Learn view ---------- */
  const quizDone={}; // per-session: lesson → Set of correctly answered questions
  function renderLearn(){
    const cur=Math.min(Math.max(S.lesson||1,1),LESSONS.length);
    const lesson=LESSONS[cur-1];
    const navH=LESSONS.map(l=>
      `<button data-lesson="${l.n}" class="${l.n===cur?'active':''}">
        <span class="lnum">${l.n}</span><span>${esc(l.title)}</span>
        ${S.lessons[l.n]?'<span class="ldone">✓</span>':''}
      </button>`).join('');
    const qz=lesson.quiz.map((qq,qi)=>
      `<div class="quizq" data-q="${qi}"><p><b>Q${qi+1}.</b> ${qq.q}</p>
        <div class="choices">${qq.choices.map((c,ci)=>`<button data-choice="${ci}">${c.t}</button>`).join('')}</div>
        <div class="qexp"></div>
      </div>`).join('');
    $('#view-learn').innerHTML=`
      <div class="lesson-layout">
        <div class="lesson-nav card flush" id="lesson-nav">${navH}</div>
        <div>
          <div class="card lesson-body">
            <p class="muted small" style="margin-top:0">Lesson ${lesson.n} of ${LESSONS.length} · ${esc(lesson.blurb)}</p>
            <h2>${esc(lesson.title)}</h2>
            ${lesson.html}
          </div>
          <div class="card" id="lesson-quiz">
            <h3 style="margin-top:0">Check yourself</h3>
            <p class="muted small">Answer all ${lesson.quiz.length} correctly (retries welcome) to mark the lesson complete.</p>
            ${qz}
            <div id="quiz-footer"></div>
          </div>
        </div>
      </div>`;
    // hydrate embedded truth tables
    document.querySelectorAll('#view-learn [data-ttable]').forEach(div=>{
      try{
        const asts=div.dataset.ttable.split(';').map(s=>parseFormula(s.trim()));
        div.innerHTML=ttableHTML(asts);
      }catch(e){ div.innerHTML='<p class="muted small">(table unavailable: '+esc(e.message)+')</p>'; }
    });
    document.querySelectorAll('#view-learn [data-ttable-sub]').forEach(div=>{
      try{ div.innerHTML=ttableHTML([parseFormula(div.dataset.ttableSub)],{subcols:true}); }
      catch(e){ div.innerHTML=''; }
    });
    $('#lesson-nav').addEventListener('click', e=>{
      const b=e.target.closest('[data-lesson]');
      if(b){ S.lesson=+b.dataset.lesson; save(); renderLearn(); window.scrollTo({top:0}); }
    });
    if(!quizDone[cur]) quizDone[cur]=new Set();
    const loggedWrong=new Set();
    $('#lesson-quiz').addEventListener('click', e=>{
      const b=e.target.closest('[data-choice]');
      if(!b) return;
      const qDiv=b.closest('.quizq');
      const qi=+qDiv.dataset.q, ci=+b.dataset.choice;
      const qq=lesson.quiz[qi];
      const exp=qDiv.querySelector('.qexp');
      if(quizDone[cur].has(qi)) return;
      if(ci===qq.a){
        b.classList.add('correct');
        qDiv.querySelectorAll('button').forEach(x=>x.disabled=true);
        exp.innerHTML='<div class="feedback good"><p>'+esc(qq.explain)+'</p></div>';
        quizDone[cur].add(qi);
        refreshQuizFooter();
      } else {
        b.classList.add('wrong');
        b.disabled=true;
        const bug=qq.choices[ci].bug;
        let msg='Not this one — try again.';
        if(bug){
          const info=mistakeInfo(bug);
          msg='<b>'+esc(info.name)+':</b> '+esc(info.tip);
          if(!loggedWrong.has(qi+'-'+ci)){ recordMistakes([bug]); loggedWrong.add(qi+'-'+ci); }
        }
        exp.innerHTML='<div class="feedback bad"><p>'+msg+'</p></div>';
      }
    });
    function refreshQuizFooter(){
      const all=quizDone[cur].size===lesson.quiz.length;
      const f=$('#quiz-footer');
      if(all){
        if(!S.lessons[cur]){ S.lessons[cur]=true; save(); }
        const next=cur<LESSONS.length
          ? '<button class="btn primary" id="next-lesson">Continue to Lesson '+(cur+1)+' →</button>'
          : '<span class="chip good">🎓 Course complete — you have the full toolkit!</span>';
        f.innerHTML='<div class="feedback good"><p><b>Lesson complete ✓</b></p></div><p>'+next+'</p>';
        const nb=$('#next-lesson');
        if(nb) nb.addEventListener('click', ()=>{ S.lesson=cur+1; save(); renderLearn(); window.scrollTo({top:0}); });
        renderLearnNavTicks();
      } else if(S.lessons[cur]){
        f.innerHTML='<p class="muted small">You have completed this lesson before — the quiz is here whenever you want a refresher.</p>';
      }
    }
    function renderLearnNavTicks(){
      document.querySelectorAll('#lesson-nav [data-lesson]').forEach(b=>{
        const n=+b.dataset.lesson;
        if(S.lessons[n] && !b.querySelector('.ldone')){
          const s=document.createElement('span'); s.className='ldone'; s.textContent='✓';
          b.appendChild(s);
        }
      });
    }
    refreshQuizFooter();
  }

  /* ---------- Progress view ---------- */
  function renderProgress(){
    const done=LESSONS.filter(l=>S.lessons[l.n]).length;
    const pct=Math.round(100*done/LESSONS.length);
    let statH='';
    for(const [k,label] of Object.entries(EXERCISE_TYPES)){
      const s=S.stats[k];
      const acc=s&&s.n?Math.round(100*s.c/s.n):null;
      statH+=`<div class="statcard"><div class="small muted">${esc(label)}</div>
        <b>${acc===null?'—':acc+'%'}</b> <span class="small muted">${s?s.n:0} attempt${s&&s.n===1?'':'s'}</span>
        <div class="bar goodbar" style="margin-top:6px"><i style="width:${acc||0}%"></i></div></div>`;
    }
    const entries=Object.entries(S.mistakes).sort((a,b)=>b[1].n-a[1].n);
    let mistH='';
    if(!entries.length){
      mistH='<p class="muted">Nothing recurring spotted yet. As you practise, any misconception you repeat will be named, explained and tracked here.</p>';
    } else {
      for(const [id,m] of entries){
        const info=mistakeInfo(id);
        mistH+=`<div class="mistake-item"><span class="count-pill">×${m.n}</span>
          <h4>${esc(info.name)}</h4>
          <p class="small" style="margin:.2em 0">${esc(info.tip)}</p>
          <p class="small" style="margin:.3em 0 0">
            ${info.lesson?lessonLink(info.lesson,'Review Lesson '+info.lesson)+' · ':''}
            <button class="btn small" data-practice-bug="${esc(id)}">Practise this →</button></p>
        </div>`;
      }
    }
    const att=Object.values(S.stats).reduce((a,s)=>a+s.n,0);
    const cor=Object.values(S.stats).reduce((a,s)=>a+s.c,0);
    $('#view-progress').innerHTML=`
    <div class="card">
      <h2>Your progress</h2>
      <div class="row"><b>Lessons</b><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted">${done} / ${LESSONS.length} complete</span></div>
      <p class="small muted">Overall practice: ${cor} correct out of ${att} attempt${att===1?'':'s'}.</p>
      <h3>Accuracy by exercise type</h3>
      <div class="statgrid">${statH}</div>
    </div>
    <div class="card">
      <h2>Your common mistakes</h2>
      <p class="muted small">LogicLab compares wrong answers against a library of classic misconceptions — when one matches repeatedly, it shows up here so you can attack it head-on.</p>
      ${mistH}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Reset</h3>
      <p class="muted small">Wipe lessons, stats and the mistake log on this device.</p>
      <button class="btn danger" id="prog-reset">Reset all progress</button>
    </div>`;
    $('#prog-reset').addEventListener('click', ()=>{
      if(confirm('Really erase all LogicLab progress on this device?')){
        S=freshState(); save(); renderProgress(); renderLearn();
      }
    });
  }

  /* ---------- Reference view ---------- */
  function renderReference(){
    const syms=[
      ['¬','negation — not','~  !  not'],
      ['∧','conjunction — and','&  ^  *  and'],
      ['∨','disjunction — inclusive or','|  +  v  or'],
      ['→','implication — if…then','->  =>  implies'],
      ['↔','biconditional — if and only if','<->  <=>  iff'],
      ['⊕','exclusive or','xor'],
      ['⊤','constant true','T  true  1'],
      ['⊥','constant false','F  false  0'],
      ['≡','equivalence claim (between two formulas)','==  ='],
      ['⊢','therefore (premises ⊢ conclusion)','|-  |=  therefore'],
    ];
    $('#view-reference').innerHTML=`
    <div class="card">
      <h2>Symbols & how to type them</h2>
      <table class="lawtable"><tr><th>Symbol</th><th>Meaning</th><th>Type any of</th></tr>
      ${syms.map(([s,m,t])=>`<tr><td class="formula"><b>${s}</b></td><td>${esc(m)}</td><td class="formula">${esc(t)}</td></tr>`).join('')}
      </table>
      <p class="small muted">Separate premises with commas: <span class="kbd">P → Q, P ⊢ Q</span>. Statement letters: any words starting with a letter (P, Q, rain, x1) — except T/F which are constants.</p>
      <h3>Precedence (tightest first)</h3>
      <p class="formula">¬ &nbsp;≻&nbsp; ∧ &nbsp;≻&nbsp; ∨ , ⊕ &nbsp;≻&nbsp; → &nbsp;≻&nbsp; ↔</p>
      <p class="small muted">¬P ∨ Q means (¬P) ∨ Q. Arrows group rightwards: P → Q → R means P → (Q → R). Brackets always welcome.</p>
    </div>
    <div class="card">
      <h2>Equivalence laws</h2>
      ${lawsTableHTML()}
    </div>
    <div class="card">
      <h2>Argument forms</h2>
      <table class="lawtable"><tr><th>Valid rules ✓</th><th>Named fallacies ✗</th></tr>
      <tr><td class="formula">modus ponens<br>A → B, A ⊢ B</td><td class="formula">affirming the consequent<br>A → B, B ⊬ A</td></tr>
      <tr><td class="formula">modus tollens<br>A → B, ¬B ⊢ ¬A</td><td class="formula">denying the antecedent<br>A → B, ¬A ⊬ ¬B</td></tr>
      <tr><td class="formula">disjunctive syllogism<br>A ∨ B, ¬A ⊢ B</td><td class="formula">exclusivity fallacy<br>A ∨ B, A ⊬ ¬B</td></tr>
      <tr><td class="formula">hypothetical syllogism<br>A → B, B → C ⊢ A → C</td><td></td></tr>
      </table>
      <h3>The conditional family</h3>
      <table class="lawtable"><tr><th>Form</th><th>Formula</th><th>≡ original?</th></tr>
      <tr><td>original</td><td class="formula">A → B</td><td>—</td></tr>
      <tr><td>contrapositive</td><td class="formula">¬B → ¬A</td><td><b>yes ✓</b></td></tr>
      <tr><td>converse</td><td class="formula">B → A</td><td>no</td></tr>
      <tr><td>inverse</td><td class="formula">¬A → ¬B</td><td>no</td></tr>
      </table>
    </div>`;
  }

  /* ---------- Router & init ---------- */
  const VIEWS=['learn','solve','tables','practice','progress','reference'];
  function showView(v){
    document.querySelectorAll('main > section').forEach(s=>s.classList.remove('visible'));
    const sec=$('#view-'+v);
    if(sec) sec.classList.add('visible');
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
    S.view=v; save();
    if(v==='progress') renderProgress();
    if(v==='practice' && !P.ex) newQuestion();
  }
  function route(){
    const h=location.hash.slice(1);
    const [v,arg]=h.split('/');
    if(v==='learn'&&arg){ S.lesson=Math.min(Math.max(+arg||1,1),LESSONS.length); save(); renderLearn(); }
    showView(VIEWS.includes(v)?v:'learn');
  }
  function init(){
    initSolve();
    initTables();
    initPractice();
    renderReference();
    renderLearn();
    renderProgress();
    $('#tabs').addEventListener('click', e=>{
      const b=e.target.closest('[data-view]');
      if(b) location.hash=b.dataset.view;
    });
    window.addEventListener('hashchange', route);
    if(location.hash) route();
    else location.hash = S.view || 'learn';
    showView((location.hash.slice(1).split('/')[0])||'learn');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})(); }
</script>
</body>
</html>
