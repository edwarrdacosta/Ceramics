<style>
:root{
  --bg:#f6f4ee;
  --card:#fffdf8;
  --line:#e3ded2;
  --ink:#23222b;
  --muted:#6f6a7c;
  --accent:#473fb8;
  --accent-ink:#ffffff;
  --accent-soft:#eceafe;
  --accent-line:#c9c4f2;
  --good:#1d7a3e;
  --good-soft:#e4f4e8;
  --bad:#b3262e;
  --bad-soft:#fbe9e7;
  --warn:#92600a;
  --warn-soft:#fdf2dc;
  --info-soft:#e8f0fb;
  --mark:#fde68a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17161d;
    --card:#201f29;
    --line:#37343f;
    --ink:#eceaf2;
    --muted:#a09aae;
    --accent:#9d92ff;
    --accent-ink:#171430;
    --accent-soft:#2c2a44;
    --accent-line:#4b4677;
    --good:#7fd49a;
    --good-soft:#1d3325;
    --bad:#ff9d96;
    --bad-soft:#3d2222;
    --warn:#e8b563;
    --warn-soft:#3a2f1a;
    --info-soft:#22293a;
    --mark:#6b5d1f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .4em}
h2{font-size:1.5rem;margin-top:.2em}
h3{font-size:1.17rem;margin-top:1.1em}
p{margin:.55em 0}
ul,ol{margin:.55em 0;padding-left:1.4em}
li{margin:.25em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}

/* ---------- masthead & tabs ---------- */
.masthead{display:flex;align-items:center;gap:14px;padding-top:22px;padding-bottom:10px}
.masthead svg{flex:none;width:46px;height:46px;border-radius:12px;box-shadow:0 2px 8px rgba(40,30,110,.25)}
.masthead h1{font-size:1.85rem;margin:0;letter-spacing:.01em}
.tagline{margin:1px 0 0;color:var(--muted);font-size:.92rem}
.tabbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:none;border:1px solid transparent;background:none;color:var(--muted);
  font:600 .95rem var(--sans);padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.tabs button:hover{background:var(--accent-soft);color:var(--ink)}
.tabs button.active{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px rgba(40,30,110,.28)}
main{padding-bottom:30px;min-height:60vh}
main > section{display:none}
main > section.visible{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- cards, buttons, inputs ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(35,30,60,.05)}
.card.flush{padding:12px 14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:600 .92rem var(--sans);
  padding:9px 16px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.tight{gap:5px}
.grow{flex:1 1 220px}
input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font:1.02rem var(--mono);padding:10px 12px;outline:none;
}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);
  font:600 .9rem var(--sans);padding:9px 10px;outline:none;cursor:pointer}
label.lbl{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* symbol palette */
.palette{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.palette button{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:600 1rem var(--mono);min-width:38px;padding:6px 9px;border-radius:8px;cursor:pointer;
}
.palette button:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.palette .plbl{font-size:.68rem;color:var(--muted);display:block;font-family:var(--sans);font-weight:600}

/* formulas, truth tables */
.formula{font-family:var(--mono);font-size:1.05em}
.bigformula{font-family:var(--mono);font-size:1.25rem;padding:10px 14px;background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:10px;display:inline-block}
.step-hl{background:var(--mark);border-radius:4px;padding:0 2px;box-shadow:0 0 0 1px color-mix(in srgb,var(--mark) 70%,#0000)}
.tt-scroll{overflow-x:auto;max-width:100%}
table.ttable{border-collapse:collapse;font-family:var(--mono);font-size:.95rem;margin:8px 0}
table.ttable th{
  background:var(--accent-soft);color:var(--ink);font-weight:700;padding:6px 12px;
  border:1px solid var(--accent-line);white-space:nowrap}
table.ttable td{border:1px solid var(--line);padding:5px 12px;text-align:center;white-space:nowrap}
table.ttable tr.hlrow td{background:var(--warn-soft)}
table.ttable tr:hover td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.tv-T{color:var(--good);font-weight:700}
.tv-F{color:var(--bad);font-weight:700}
table.lawtable{border-collapse:collapse;font-size:.92rem;margin:8px 0;width:100%}
table.lawtable th{background:var(--accent-soft);border:1px solid var(--accent-line);padding:6px 10px;text-align:left}
table.lawtable td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}

/* chips & verdicts */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font:700 .8rem var(--sans);
  padding:4px 12px;border:1px solid var(--line);background:var(--bg)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,#0000)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,#0000)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,#0000)}
.chip.neutral{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}

/* derivation steps */
.steps{list-style:none;margin:10px 0 4px;padding:0}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:8px 4px;border-top:1px dashed var(--line)}
.steps li:first-child{border-top:none}
.steps .num{color:var(--muted);font:700 .85rem var(--mono);padding-top:3px}
.steps .formula{overflow-x:auto}
.steps .why{grid-column:2;font-size:.84rem;color:var(--muted)}
.steps .why b{color:var(--accent)}
.law-badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
  font:700 .75rem var(--sans);border-radius:6px;padding:1px 7px;margin-right:6px}

/* feedback panels */
.feedback{border-radius:12px;padding:13px 16px;margin:12px 0;border:1px solid var(--line);border-left-width:5px}
.feedback.good{background:var(--good-soft);border-left-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.feedback.info{background:var(--info-soft);border-left-color:var(--accent)}
.feedback h4{margin:0 0 4px;font-family:var(--sans);font-size:.98rem}
.feedback p{margin:.35em 0}

/* learn view */
.lesson-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.lesson-nav{position:sticky;top:64px}
.lesson-nav button{
  display:flex;width:100%;text-align:left;gap:9px;align-items:baseline;background:none;
  border:1px solid transparent;border-radius:9px;padding:8px 10px;cursor:pointer;
  color:var(--ink);font:500 .9rem var(--sans)}
.lesson-nav button:hover{background:var(--accent-soft)}
.lesson-nav button.active{background:var(--accent);color:var(--accent-ink);font-weight:700}
.lesson-nav .lnum{font:700 .78rem var(--mono);color:var(--muted);flex:none;width:18px}
.lesson-nav button.active .lnum{color:var(--accent-ink)}
.lesson-nav .ldone{margin-left:auto;color:var(--good);font-weight:700}
.lesson-nav button.active .ldone{color:var(--accent-ink)}
.lesson-body .formula{white-space:nowrap}
.takeaway{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:11px 15px;margin:12px 0}
.takeaway h4{margin:0 0 4px;font-family:var(--sans);font-size:.9rem;color:var(--accent)}
.mistakebox{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,#0000);
  border-radius:12px;padding:11px 15px;margin:12px 0}
.mistakebox h4{margin:0 0 4px;font-family:var(--sans);font-size:.9rem;color:var(--warn)}

/* quiz & practice */
.choices{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.choices button{
  text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 13px;cursor:pointer;font:500 .95rem var(--sans)}
.choices button:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft)}
.choices button.correct{border-color:var(--good);background:var(--good-soft);font-weight:700}
.choices button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choices button:disabled{cursor:default;opacity:.92}
.tfbtns{display:flex;gap:8px;margin:10px 0}
.tfbtns button{font:700 1.05rem var(--mono);padding:9px 26px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tfbtns button:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft)}
.tfbtns button.correct{border-color:var(--good);background:var(--good-soft)}
.tfbtns button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tfbtns button:disabled{cursor:default}
.envchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.envchip{font:700 .95rem var(--mono);background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:8px;padding:3px 10px}
.scorebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.tt-select{font:700 .95rem var(--mono);padding:4px 8px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink)}
.tt-select.cellok{border-color:var(--good);background:var(--good-soft)}
.tt-select.cellbad{border-color:var(--bad);background:var(--bad-soft)}

/* progress view */
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1 1 120px;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.goodbar i{background:var(--good)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.statcard{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--bg)}
.statcard b{font-size:1.25rem}
.mistake-item{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;
  padding:11px 15px;margin:9px 0;background:var(--card)}
.mistake-item h4{margin:0 0 3px;font-family:var(--sans);font-size:.97rem}
.count-pill{float:right;background:var(--warn-soft);color:var(--warn);font:700 .8rem var(--sans);
  border-radius:999px;padding:2px 10px;margin-left:8px}

/* misc */
details{border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin:10px 0;background:var(--card)}
details summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--accent)}
details[open] summary{margin-bottom:8px}
kbd,.kbd{font:600 .85em var(--mono);background:var(--bg);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.err-echo{font-family:var(--mono);white-space:pre;overflow-x:auto;margin:6px 0 0;line-height:1.3}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;text-align:center;
  padding:18px 16px 26px;margin-top:26px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){
  .lesson-layout{grid-template-columns:1fr}
  .lesson-nav{position:static;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .lesson-nav button{width:auto;white-space:nowrap;flex:none;border:1px solid var(--line)}
  .lesson-nav .ldone{margin-left:6px}
  .cols2{grid-template-columns:1fr}
  .masthead h1{font-size:1.5rem}
  body{font-size:15.5px}
}
</style>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   LogicLab — engine + tutor + UI in one file.
   Sections: AST · Parser · Evaluation · Laws & rewriting ·
             Misconception library · Exercises · Lessons · UI.
   The engine is DOM-free so it can be unit-tested in Node.
   ════════════════════════════════════════════════════════════════════ */

/* ───────────────────────────── 1 · AST ───────────────────────────── */

const A = name => ({k:'atom', name});
const K = v    => ({k:'const', v:!!v});
const N = a    => ({k:'not', a});
const B = (op,a,b) => ({k:'bin', op, a, b});

const PREC  = {iff:1, imp:2, or:3, xor:3, and:4};
const ASSOC = {iff:'r', imp:'r', or:'l', xor:'l', and:'l'};
const SYM   = {and:'∧', or:'∨', xor:'⊕', imp:'→', iff:'↔'};

function eq(x,y){
  if(x===y) return true;
  if(x.k!==y.k) return false;
  switch(x.k){
    case 'atom':  return x.name===y.name;
    case 'const': return x.v===y.v;
    case 'not':   return eq(x.a,y.a);
    case 'bin':   return x.op===y.op && eq(x.a,y.a) && eq(x.b,y.b);
  }
}
function clone(n){
  switch(n.k){
    case 'atom':  return A(n.name);
    case 'const': return K(n.v);
    case 'not':   return N(clone(n.a));
    case 'bin':   return B(n.op, clone(n.a), clone(n.b));
  }
}
function nodeCount(n){
  switch(n.k){
    case 'atom': case 'const': return 1;
    case 'not': return 1+nodeCount(n.a);
    case 'bin': return 1+nodeCount(n.a)+nodeCount(n.b);
  }
}
function prec(n){ return n.k==='bin' ? PREC[n.op] : (n.k==='not' ? 5 : 6); }
function binChildParens(parent, child, side){
  const pp=PREC[parent.op], cp=prec(child);
  if(cp>pp) return false;
  if(cp<pp) return true;
  if(child.k==='bin' && child.op===parent.op) return ASSOC[parent.op]!==side;
  return true; // same precedence, different operator (∨ vs ⊕): always disambiguate
}
function format(n){
  switch(n.k){
    case 'atom':  return n.name;
    case 'const': return n.v?'⊤':'⊥';
    case 'not': { const s=format(n.a); return '¬'+(prec(n.a)<5?'('+s+')':s); }
    case 'bin': {
      const l=format(n.a), r=format(n.b);
      return (binChildParens(n,n.a,'l')?'('+l+')':l)+' '+SYM[n.op]+' '+
             (binChildParens(n,n.b,'r')?'('+r+')':r);
    }
  }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatHTML(n, focus){
  function go(x){
    let s;
    switch(x.k){
      case 'atom':  s=esc(x.name); break;
      case 'const': s=x.v?'⊤':'⊥'; break;
      case 'not': { const c=go(x.a); s='¬'+(prec(x.a)<5?'('+c+')':c); break; }
      case 'bin': {
        const l=go(x.a), r=go(x.b);
        s=(binChildParens(x,x.a,'l')?'('+l+')':l)+' '+SYM[x.op]+' '+
          (binChildParens(x,x.b,'r')?'('+r+')':r);
        break;
      }
    }
    return x===focus ? '<span class="step-hl">'+s+'</span>' : s;
  }
  return go(n);
}

/* ──────────────────────────── 2 · Parser ──────────────────────────── */

class LogicError extends Error{
  constructor(msg, pos){ super(msg); this.name='LogicError'; this.pos=pos; }
}
const KEYWORDS = {and:'and', or:'or', xor:'xor', not:'not', implies:'imp', iff:'iff', therefore:'turn'};
const SYMTOK = {
  '~':'not','!':'not','¬':'not',
  '&':'and','∧':'and','^':'and','·':'and','*':'and','×':'and',
  '|':'or','∨':'or','+':'or',
  '⊕':'xor','⊻':'xor',
  '→':'imp','⊃':'imp','⇒':'imp',
  '↔':'iff','⇔':'iff',
  '≡':'equiv','=':'equiv',
  '⊢':'turn','⊨':'turn','∴':'turn',
  '(':'lp','[':'lp',')':'rp',']':'rp',
  ',':'comma'
};

function tokenize(src){
  const toks=[]; let i=0;
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){ i++; continue; }
    const start=i;
    const three=src.slice(i,i+3), two=src.slice(i,i+2);
    if(three==='<->'||three==='<=>'){ toks.push({t:'iff',pos:start}); i+=3; continue; }
    if(two==='->'||two==='=>'){ toks.push({t:'imp',pos:start}); i+=2; continue; }
    if(two==='|-'||two==='|='){ toks.push({t:'turn',pos:start}); i+=2; continue; }
    if(two==='=='){ toks.push({t:'equiv',pos:start}); i+=2; continue; }
    if(/[A-Za-z_]/.test(c)){
      let j=i; while(j<src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      const word=src.slice(i,j), lw=word.toLowerCase();
      if(word==='v')                toks.push({t:'or',pos:start});
      else if(KEYWORDS[lw])         toks.push({t:KEYWORDS[lw],pos:start});
      else if(lw==='true'||word==='T'||word==='t') toks.push({t:'const',v:true,pos:start});
      else if(lw==='false'||word==='F'||word==='f') toks.push({t:'const',v:false,pos:start});
      else                          toks.push({t:'atom',v:word,pos:start});
      i=j; continue;
    }
    if(/[0-9]/.test(c)){
      let j=i; while(j<src.length && /[0-9]/.test(src[j])) j++;
      const num=src.slice(i,j);
      if(num==='1'){ toks.push({t:'const',v:true,pos:start}); i=j; continue; }
      if(num==='0'){ toks.push({t:'const',v:false,pos:start}); i=j; continue; }
      throw new LogicError('Use letters like P, Q, R as statement names (only 1 and 0 work as truth constants).', start);
    }
    if(c==='⊤'){ toks.push({t:'const',v:true,pos:start}); i++; continue; }
    if(c==='⊥'){ toks.push({t:'const',v:false,pos:start}); i++; continue; }
    const m=SYMTOK[c];
    if(m){ toks.push({t:m,pos:start}); i++; continue; }
    throw new LogicError('I don\'t recognise the character "'+c+'".', start);
  }
  return toks;
}

const TOKDESC = {and:'∧',or:'∨',xor:'⊕',imp:'→',iff:'↔',not:'¬',lp:'(',rp:')',comma:',',turn:'⊢',equiv:'≡'};

function parseInput(src){
  const toks=tokenize(src);
  let p=0;
  const atEnd =()=>p>=toks.length;
  const peek  =()=>toks[p];
  const next  =()=>toks[p++];
  const endPos=()=>atEnd()?src.length:peek().pos;

  function parseUnary(){
    if(atEnd()) throw new LogicError('The formula ends where a statement was still expected — is an operator missing its operand?', src.length);
    const tok=peek();
    if(tok.t==='not'){ next(); return N(parseUnary()); }
    if(tok.t==='lp'){
      next();
      const e=parseExpr();
      if(atEnd()||peek().t!=='rp') throw new LogicError('Missing a closing parenthesis for the "(" at position '+(tok.pos+1)+'.', endPos());
      next(); return e;
    }
    if(tok.t==='atom'){ next(); return A(tok.v); }
    if(tok.t==='const'){ next(); return K(tok.v); }
    if(tok.t==='rp') throw new LogicError('Unexpected ")" — there is no matching "(".', tok.pos);
    throw new LogicError('Found "'+(TOKDESC[tok.t]||tok.t)+'" where a statement was expected. Binary operators go between two statements.', tok.pos);
  }
  function parseAnd(){
    let a=parseUnary();
    while(!atEnd() && peek().t==='and'){ next(); a=B('and', a, parseUnary()); }
    return a;
  }
  function parseOr(){
    let a=parseAnd();
    while(!atEnd() && (peek().t==='or'||peek().t==='xor')){
      const op=next().t; a=B(op, a, parseAnd());
    }
    return a;
  }
  function parseImp(){
    const a=parseOr();
    if(!atEnd() && peek().t==='imp'){ next(); return B('imp', a, parseImp()); }
    return a;
  }
  function parseExpr(){
    const a=parseImp();
    if(!atEnd() && peek().t==='iff'){ next(); return B('iff', a, parseExpr()); }
    return a;
  }
  function noTrailing(){
    if(atEnd()) return;
    const tok=peek();
    if(tok.t==='atom') throw new LogicError('Expected an operator before "'+tok.v+'" — join statements with ∧, ∨, →, ↔ or ⊕.', tok.pos);
    if(tok.t==='rp') throw new LogicError('Unexpected ")" — there is no matching "(".', tok.pos);
    throw new LogicError('Unexpected "'+(TOKDESC[tok.t]||tok.t)+'" here.', tok.pos);
  }

  if(toks.length===0) throw new LogicError('Type a formula to begin — for example: ¬(P ∧ Q) → R', 0);
  const first=parseExpr();
  if(atEnd()) return {kind:'formula', ast:first};
  if(peek().t==='equiv'){
    next();
    const rhs=parseExpr();
    noTrailing();
    return {kind:'equiv', left:first, right:rhs};
  }
  if(peek().t==='comma'||peek().t==='turn'){
    const premises=[first];
    while(!atEnd() && peek().t==='comma'){ next(); premises.push(parseExpr()); }
    if(atEnd()||peek().t!=='turn')
      throw new LogicError('After a comma-separated list of premises, write ⊢ (or |- or ∴) before the conclusion.', endPos());
    next();
    const conclusion=parseExpr();
    noTrailing();
    return {kind:'argument', premises, conclusion};
  }
  noTrailing();
  return {kind:'formula', ast:first};
}
function parseFormula(src){
  const r=parseInput(src);
  if(r.kind!=='formula') throw new LogicError('Enter a single formula here (without ≡, ⊢ or commas).', 0);
  return r.ast;
}

/* ─────────────────────────── 3 · Evaluation ─────────────────────────── */

function evl(n, env){
  switch(n.k){
    case 'atom':  return !!env[n.name];
    case 'const': return n.v;
    case 'not':   return !evl(n.a,env);
    case 'bin': {
      const a=evl(n.a,env), b=evl(n.b,env);
      switch(n.op){
        case 'and': return a&&b;
        case 'or':  return a||b;
        case 'xor': return a!==b;
        case 'imp': return !a||b;
        case 'iff': return a===b;
      }
    }
  }
}
function atomsOf(n, s){
  s=s||new Set();
  if(n.k==='atom') s.add(n.name);
  else if(n.k==='not') atomsOf(n.a,s);
  else if(n.k==='bin'){ atomsOf(n.a,s); atomsOf(n.b,s); }
  return s;
}
function atomList(...asts){
  const s=new Set();
  asts.forEach(a=>atomsOf(a,s));
  return [...s].sort();
}
function rowsFor(atoms){
  const n=atoms.length, out=[];
  if(n>16) throw new LogicError('Too many distinct statement letters (max 16).',0);
  for(let i=0;i<(1<<n);i++){
    const env={};
    atoms.forEach((a,j)=>{ env[a] = ((i>>(n-1-j))&1)===0; }); // first row: all true
    out.push(env);
  }
  return out;
}
function subformulas(n){
  const acc=[], seen=new Set();
  (function go(x){
    if(x.k==='atom'||x.k==='const') return;
    if(x.k==='not') go(x.a); else { go(x.a); go(x.b); }
    const s=format(x);
    if(!seen.has(s)){ seen.add(s); acc.push(x); }
  })(n);
  return acc;
}
function classify(ast){
  const atoms=atomList(ast);
  let t=0, total=0;
  for(const env of rowsFor(atoms)){ total++; if(evl(ast,env)) t++; }
  const verdict = t===total ? 'tautology' : (t===0 ? 'contradiction' : 'contingency');
  return {verdict, trueCount:t, total};
}
function equivalent(x,y){
  for(const env of rowsFor(atomList(x,y))) if(evl(x,env)!==evl(y,env)) return false;
  return true;
}
function counterexamples(x,y,limit){
  limit=limit||3;
  const out=[];
  for(const env of rowsFor(atomList(x,y))){
    const vx=evl(x,env), vy=evl(y,env);
    if(vx!==vy){ out.push({env,vx,vy}); if(out.length>=limit) break; }
  }
  return out;
}
function argumentCheck(premises, conclusion){
  const atoms=atomList(...premises, conclusion);
  const bad=[];
  for(const env of rowsFor(atoms)){
    if(premises.every(pr=>evl(pr,env)) && !evl(conclusion,env)) bad.push(env);
  }
  return {valid:bad.length===0, counterexamples:bad, atoms};
}

/* Altered-semantics models: how the formula behaves under a common misconception.
   Used to diagnose wrong truth-value answers. */
const MODELS=[
  {id:'imp-as-and',  bug:'imp-as-and',  needs:'imp', ops:{imp:(a,b)=>a&&b}},
  {id:'imp-as-or',   bug:'imp-as-or',   needs:'imp', ops:{imp:(a,b)=>a||b}},
  {id:'imp-reversed',bug:'converse',    needs:'imp', ops:{imp:(a,b)=>!b||a}},
  {id:'or-as-xor',   bug:'or-as-xor',   needs:'or',  ops:{or:(a,b)=>a!==b}}
];
function evlModel(n, env, ops){
  switch(n.k){
    case 'atom':  return !!env[n.name];
    case 'const': return n.v;
    case 'not':   return !evlModel(n.a,env,ops);
    case 'bin': {
      const a=evlModel(n.a,env,ops), b=evlModel(n.b,env,ops);
      if(ops[n.op]) return ops[n.op](a,b);
      switch(n.op){
        case 'and': return a&&b;
        case 'or':  return a||b;
        case 'xor': return a!==b;
        case 'imp': return !a||b;
        case 'iff': return a===b;
      }
    }
  }
}
function usesOp(n, op){
  if(n.k==='bin') return n.op===op || usesOp(n.a,op) || usesOp(n.b,op);
  if(n.k==='not') return usesOp(n.a,op);
  return false;
}

/* ──────────────────── 4 · Laws & step-by-step rewriting ──────────────────── */

const isC  = (n,v)=> n.k==='const' && n.v===v;
const isOp = (n,o)=> n.k==='bin' && n.op===o;
const negPair=(x,y)=> (y.k==='not'&&eq(y.a,x)) || (x.k==='not'&&eq(x.a,y));

const RULES={
  constNeg:{ name:'Negation of a constant', schema:'¬⊤ ≡ ⊥   ·   ¬⊥ ≡ ⊤',
    why:'Flipping a known truth value.',
    try(n){ if(n.k==='not'&&n.a.k==='const') return K(!n.a.v); } },
  doubleNeg:{ name:'Double negation', schema:'¬¬A ≡ A',
    why:'Two negations cancel out.',
    try(n){ if(n.k==='not'&&n.a.k==='not') return n.a.a; } },
  identity:{ name:'Identity', schema:'A ∧ ⊤ ≡ A   ·   A ∨ ⊥ ≡ A',
    why:'Combining with the neutral constant changes nothing.',
    try(n){ if(n.k!=='bin') return;
      if(n.op==='and'){ if(isC(n.b,true)) return n.a; if(isC(n.a,true)) return n.b; }
      if(n.op==='or'){ if(isC(n.b,false)) return n.a; if(isC(n.a,false)) return n.b; } } },
  domination:{ name:'Domination', schema:'A ∨ ⊤ ≡ ⊤   ·   A ∧ ⊥ ≡ ⊥',
    why:'One operand already decides the result.',
    try(n){ if(n.k!=='bin') return;
      if(n.op==='and'&&(isC(n.a,false)||isC(n.b,false))) return K(false);
      if(n.op==='or'&&(isC(n.a,true)||isC(n.b,true))) return K(true); } },
  idempotent:{ name:'Idempotence', schema:'A ∧ A ≡ A   ·   A ∨ A ≡ A',
    why:'Repeating the same statement adds nothing.',
    try(n){ if(n.k==='bin'&&(n.op==='and'||n.op==='or')&&eq(n.a,n.b)) return n.a; } },
  complement:{ name:'Complement', schema:'A ∧ ¬A ≡ ⊥   ·   A ∨ ¬A ≡ ⊤',
    why:'A statement and its negation: never both true, always one true.',
    try(n){ if(n.k==='bin'&&negPair(n.a,n.b)){
      if(n.op==='and') return K(false);
      if(n.op==='or') return K(true); } } },
  absorption:{ name:'Absorption', schema:'A ∧ (A ∨ B) ≡ A   ·   A ∨ (A ∧ B) ≡ A',
    why:'The inner part is already settled by the outer A.',
    try(n){ if(n.k!=='bin') return;
      const inner=n.op==='and'?'or':(n.op==='or'?'and':null);
      if(!inner) return;
      if(isOp(n.b,inner)&&(eq(n.b.a,n.a)||eq(n.b.b,n.a))) return n.a;
      if(isOp(n.a,inner)&&(eq(n.a.a,n.b)||eq(n.a.b,n.b))) return n.b; } },
  negAbsorb:{ name:'Absorption with negation', schema:'A ∧ (¬A ∨ B) ≡ A ∧ B   ·   A ∨ (¬A ∧ B) ≡ A ∨ B',
    why:'Inside the bracket, the ¬A part can never help, so only B matters.',
    try(n){ if(n.k!=='bin') return;
      const inner=n.op==='and'?'or':(n.op==='or'?'and':null);
      if(!inner) return;
      if(isOp(n.b,inner)){
        if(negPair(n.a,n.b.a)) return B(n.op,n.a,n.b.b);
        if(negPair(n.a,n.b.b)) return B(n.op,n.a,n.b.a);
      }
      if(isOp(n.a,inner)){
        if(negPair(n.b,n.a.a)) return B(n.op,n.a.b,n.b);
        if(negPair(n.b,n.a.b)) return B(n.op,n.a.a,n.b);
      } } },
  factor:{ name:'Factoring (reverse distribution)', schema:'(A∧B) ∨ (A∧C) ≡ A ∧ (B∨C)   ·   (A∨B) ∧ (A∨C) ≡ A ∨ (B∧C)',
    why:'Pulling out the shared part.',
    try(n){ if(n.k!=='bin') return;
      const inner=n.op==='and'?'or':(n.op==='or'?'and':null);
      if(!inner||!isOp(n.a,inner)||!isOp(n.b,inner)) return;
      const L=n.a, R=n.b;
      if(eq(L.a,R.a)) return B(inner, L.a, B(n.op, L.b, R.b));
      if(eq(L.a,R.b)) return B(inner, L.a, B(n.op, L.b, R.a));
      if(eq(L.b,R.a)) return B(inner, L.b, B(n.op, L.a, R.b));
      if(eq(L.b,R.b)) return B(inner, L.b, B(n.op, L.a, R.a)); } },
  impSimp:{ name:'Implication simplification', schema:'A→A ≡ ⊤ · ⊤→A ≡ A · A→⊥ ≡ ¬A · ⊥→A ≡ ⊤ · A→⊤ ≡ ⊤',
    why:'Implications with a constant or repeated part collapse.',
    try(n){ if(!isOp(n,'imp')) return;
      if(eq(n.a,n.b)) return K(true);
      if(isC(n.b,true)) return K(true);
      if(isC(n.a,false)) return K(true);
      if(isC(n.a,true)) return n.b;
      if(isC(n.b,false)) return N(n.a);
      if(negPair(n.a,n.b)) return n.b; } },
  iffSimp:{ name:'Biconditional simplification', schema:'A↔A ≡ ⊤ · A↔⊤ ≡ A · A↔⊥ ≡ ¬A · A↔¬A ≡ ⊥',
    why:'Biconditionals with a constant or repeated part collapse.',
    try(n){ if(!isOp(n,'iff')) return;
      if(eq(n.a,n.b)) return K(true);
      if(isC(n.b,true)) return n.a;
      if(isC(n.a,true)) return n.b;
      if(isC(n.b,false)) return N(n.a);
      if(isC(n.a,false)) return N(n.b);
      if(negPair(n.a,n.b)) return K(false); } },
  xorSimp:{ name:'Exclusive-or simplification', schema:'A⊕A ≡ ⊥ · A⊕⊥ ≡ A · A⊕⊤ ≡ ¬A · A⊕¬A ≡ ⊤',
    why:'Exclusive-or with a constant or repeated part collapses.',
    try(n){ if(!isOp(n,'xor')) return;
      if(eq(n.a,n.b)) return K(false);
      if(isC(n.b,false)) return n.a;
      if(isC(n.a,false)) return n.b;
      if(isC(n.b,true)) return N(n.a);
      if(isC(n.a,true)) return N(n.b);
      if(negPair(n.a,n.b)) return K(true); } },
  deMorgan:{ name:"De Morgan's law", schema:'¬(A∧B) ≡ ¬A∨¬B   ·   ¬(A∨B) ≡ ¬A∧¬B',
    why:'A negation moves inside and the connective flips.',
    try(n){ if(n.k!=='not') return;
      if(isOp(n.a,'and')) return B('or', N(n.a.a), N(n.a.b));
      if(isOp(n.a,'or'))  return B('and', N(n.a.a), N(n.a.b)); } },
  dmNeg:{ name:'De Morgan + double negation', schema:'¬(¬A ∨ ¬B) ≡ A ∧ B   ·   ¬(¬A ∧ B) ≡ A ∨ ¬B',
    why:'The negation moves inside (flipping the connective) and cancels against inner negations.',
    try(n){ if(n.k!=='not') return;
      if((isOp(n.a,'and')||isOp(n.a,'or')) && (n.a.a.k==='not'||n.a.b.k==='not')){
        const flip=n.a.op==='and'?'or':'and';
        const negSimp=x=>x.k==='not'?x.a:N(x);
        return B(flip, negSimp(n.a.a), negSimp(n.a.b));
      } } },
  negImp:{ name:'Negated conditional', schema:'¬(A → B) ≡ A ∧ ¬B',
    why:'A broken promise: the if-part holds and the then-part fails.',
    try(n){ if(n.k==='not'&&isOp(n.a,'imp')) return B('and', n.a.a, N(n.a.b)); } },
  negIff:{ name:'Negated biconditional', schema:'¬(A ↔ B) ≡ A ⊕ B   ·   ¬(A ⊕ B) ≡ A ↔ B',
    why:'“Not the same value” is exclusive-or; “not different values” is the biconditional.',
    try(n){ if(n.k==='not'&&isOp(n.a,'iff')) return B('xor', n.a.a, n.a.b);
      if(n.k==='not'&&isOp(n.a,'xor')) return B('iff', n.a.a, n.a.b); } },
  impElim:{ name:'Material implication', schema:'A → B ≡ ¬A ∨ B',
    why:'An implication is a disjunction: either the if-part fails or the then-part holds.',
    try(n){ if(isOp(n,'imp')) return B('or', N(n.a), n.b); } },
  iffExpand:{ name:'Biconditional expansion', schema:'A ↔ B ≡ (A→B) ∧ (B→A)',
    why:'“If and only if” is two implications at once.',
    try(n){ if(isOp(n,'iff')) return B('and', B('imp',n.a,n.b), B('imp',n.b,n.a)); } },
  xorExpand:{ name:'Exclusive-or expansion', schema:'A ⊕ B ≡ (A∨B) ∧ ¬(A∧B)',
    why:'Exactly one: at least one, but not both.',
    try(n){ if(isOp(n,'xor')) return B('and', B('or',n.a,n.b), N(B('and',n.a,n.b))); } },
  distOr:{ name:'Distributivity (∨ over ∧)', schema:'A ∨ (B∧C) ≡ (A∨B) ∧ (A∨C)',
    why:'Distributing to move towards a conjunction of clauses.',
    try(n){ if(!isOp(n,'or')) return;
      if(isOp(n.b,'and')) return B('and', B('or',n.a,n.b.a), B('or',n.a,n.b.b));
      if(isOp(n.a,'and')) return B('and', B('or',n.a.a,n.b), B('or',n.a.b,n.b)); } },
  distAnd:{ name:'Distributivity (∧ over ∨)', schema:'A ∧ (B∨C) ≡ (A∧B) ∨ (A∧C)',
    why:'Distributing to move towards a disjunction of terms.',
    try(n){ if(!isOp(n,'and')) return;
      if(isOp(n.b,'or')) return B('or', B('and',n.a,n.b.a), B('and',n.a,n.b.b));
      if(isOp(n.a,'or')) return B('or', B('and',n.a.a,n.b), B('and',n.a.b,n.b)); } }
};

const CLEAN_CORE=['constNeg','doubleNeg','identity','domination','idempotent','complement',
                  'absorption','negAbsorb','impSimp','iffSimp','xorSimp'];
const MODES={
  simplify:{label:'Simplify', rules:[...CLEAN_CORE,'dmNeg','negImp','negIff','factor'],
    desc:'Shrinks the formula using the standard equivalence laws, keeping →, ↔ and ⊕.'},
  nnf:{label:'Negation normal form', rules:[...CLEAN_CORE,'factor','deMorgan','impElim','iffExpand','xorExpand'],
    desc:'Eliminates →, ↔, ⊕ and pushes every ¬ onto the statement letters.'},
  cnf:{label:'Conjunctive normal form', rules:[...CLEAN_CORE,'deMorgan','impElim','iffExpand','xorExpand','distOr'],
    desc:'An AND of OR-clauses — the form used by SAT solvers.'},
  dnf:{label:'Disjunctive normal form', rules:[...CLEAN_CORE,'deMorgan','impElim','iffExpand','xorExpand','distAnd'],
    desc:'An OR of AND-terms — reads off the true rows of the table.'}
};

/* Apply the first applicable rule, scanning the tree outside-in. */
function applyFirst(root, ruleIds){
  let hit=null;
  function walk(n){
    for(const id of ruleIds){
      const out=RULES[id].try(n);
      if(out){
        const fresh=clone(out); // fresh identities so highlighting is unambiguous
        hit={ruleId:id, from:n, to:fresh};
        return fresh;
      }
    }
    if(n.k==='not'){ const c=walk(n.a); return c?N(c):null; }
    if(n.k==='bin'){
      const l=walk(n.a); if(l) return B(n.op,l,n.b);
      const r=walk(n.b); if(r) return B(n.op,n.a,r);
    }
    return null;
  }
  const newRoot=walk(root);
  return newRoot ? {root:newRoot, ...hit} : null;
}
function derive(ast, mode, maxSteps){
  maxSteps=maxSteps||200;
  const ruleIds=MODES[mode].rules;
  const steps=[]; let cur=ast;
  while(steps.length<maxSteps){
    const st=applyFirst(cur, ruleIds);
    if(!st) break;
    steps.push({ruleId:st.ruleId, rule:RULES[st.ruleId], before:cur, after:st.root, focusB:st.from, focusA:st.to});
    cur=st.root;
  }
  return {result:cur, steps, truncated:steps.length>=maxSteps};
}

const isLit = n => n.k==='atom' || n.k==='const' || (n.k==='not' && n.a.k==='atom');
function isDisjOfLits(n){ return isLit(n) || (isOp(n,'or') && isDisjOfLits(n.a) && isDisjOfLits(n.b)); }
function isConjOfLits(n){ return isLit(n) || (isOp(n,'and') && isConjOfLits(n.a) && isConjOfLits(n.b)); }
function isCNF(n){ return isOp(n,'and') ? isCNF(n.a)&&isCNF(n.b) : isDisjOfLits(n); }
function isDNF(n){ return isOp(n,'or') ? isDNF(n.a)&&isDNF(n.b) : isConjOfLits(n); }
function isNNF(n){
  if(n.k==='atom'||n.k==='const') return true;
  if(n.k==='not') return n.a.k==='atom';
  if(n.k==='bin') return (n.op==='and'||n.op==='or') && isNNF(n.a) && isNNF(n.b);
  return false;
}

/* ──────────────── 5 · Misconception library (the "bug" catalogue) ──────────────── */
/* Each bug is a WRONG rewrite students commonly make. To diagnose a wrong answer we
   apply each bug at every position of the original formula and check whether the
   student's answer is equivalent to any buggy result. Ordered specific → generic. */

const BUGS=[

function mistakeInfo(id){
  const b=BUGS.find(x=>x.id===id);
  if(b) return b;
  if(FALLACIES[id]) return {id, ...FALLACIES[id]};
  return {id, name:id, tip:'', lesson:null};
}

/* Apply a buggy transform at every position of `root`; collect whole-formula variants. */
function variantsAt(root, tryFn){
  const out=[];
  (function walk(n, rebuild){
    for(const r of (tryFn(n)||[])) out.push(rebuild(r));
    if(n.k==='not') walk(n.a, c=>rebuild(N(c)));
    else if(n.k==='bin'){
      walk(n.a, c=>rebuild(B(n.op,c,n.b)));
      walk(n.b, c=>rebuild(B(n.op,n.a,c)));
    }
  })(root, x=>x);
  return out;
}
/* Given the original formula and a wrong (non-equivalent) answer, find the most
   likely misconception. Returns {bug, wrongForm} or null. */
function diagnose(original, userAst){
  for(const bug of BUGS){
    for(const v of variantsAt(original, n=>bug.try(n))){
      if(equivalent(v, original)) continue;   // bug made no difference here — not informative
      if(equivalent(userAst, v)) return {bug, wrongForm:v};
    }
  }
  return null;
}

/* ──────────────── 6 · Pure HTML builders (engine-side, DOM-free) ──────────────── */

function tv(b){ return b ? '<td class="tv-T">T</td>' : '<td class="tv-F">F</td>'; }
function ttableHTML(asts, opts){
  opts=opts||{};
  const atoms=atomList(...asts);
  const cols=[];
  const seen=new Set(atoms);
  for(const ast of asts){
    const list = opts.subcols ? subformulas(ast) : [ast];
    for(const c of list){
      const s=format(c);
      if(seen.has(s)) continue;
      seen.add(s); cols.push(c);
    }
  }
  let h='<div class="tt-scroll"><table class="ttable"><tr>';
  for(const a of atoms) h+='<th>'+esc(a)+'</th>';
  for(const c of cols) h+='<th>'+esc(format(c))+'</th>';
  h+='</tr>';
  for(const env of rowsFor(atoms)){
    const hl = opts.hlPred && opts.hlPred(env);
    h+='<tr'+(hl?' class="hlrow"':'')+'>';
    for(const a of atoms) h+=tv(env[a]);
    for(const c of cols) h+=tv(evl(c,env));
    h+='</tr>';
  }
  return h+'</table></div>';
}
function envHTML(env, atoms){
  return '<span class="envchips">'+atoms.map(a=>
    '<span class="envchip">'+esc(a)+' = '+(env[a]?'T':'F')+'</span>').join('')+'</span>';
}
function envSentence(env, atoms){
  return atoms.map(a=>a+' = '+(env[a]?'T':'F')).join(', ');
}
function evalWalkHTML(ast, env){
  const atoms=atomList(ast);
  let h='<div class="tt-scroll"><table class="ttable"><tr><th>part</th><th>value</th></tr>';
  for(const a of atoms) h+='<tr><td>'+esc(a)+'</td>'+tv(env[a])+'</tr>';
  for(const s of subformulas(ast)) h+='<tr><td>'+esc(format(s))+'</td>'+tv(evl(s,env))+'</tr>';
  return h+'</table></div>';
}

let _seed=(Date.now()%2147483647)>>>0;
function rnd(){ _seed=(_seed*1664525+1013904223)>>>0; return _seed/4294967296; }
function ri(n){ return Math.floor(rnd()*n); }
function pick(arr){ return arr[ri(arr.length)]; }
function pickAtoms(k){
  const pool=['P','Q','R','S'];
  for(let i=pool.length-1;i>0;i--){ const j=ri(i+1); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,k);
}
function renameAtoms(n, map){
  switch(n.k){
    case 'atom':  return A(map[n.name]||n.name);
    case 'const': return K(n.v);
    case 'not':   return N(renameAtoms(n.a,map));
    case 'bin':   return B(n.op, renameAtoms(n.a,map), renameAtoms(n.b,map));
  }
}
function freshRename(ast){
  const atoms=atomList(ast);
  const fresh=pickAtoms(Math.max(atoms.length,1));
  const map={}; atoms.forEach((a,i)=>map[a]=fresh[i]);
  return renameAtoms(ast,map);
}

  '(P ∨ Q) → P','P → (P ∧ Q)','¬P → ¬Q'];

const LAW_NAMES=[...new Set(LAW_INSTANCES.map(i=>i.law))];

  {prem:['P → Q','P'], concl:'Q', valid:true, rule:'modus ponens'},
  {prem:['P → Q','¬Q'], concl:'¬P', valid:true, rule:'modus tollens'},

const EXERCISE_TYPES={
  simplify:'Rewrite & simplify', evaluate:'Evaluate', table:'Fill the table',
  law:'Name the law', argument:'Valid or not?'
};

function genExercise(type, opts){
  opts=opts||{};
  switch(type){
    case 'simplify': {
      let pool=SIMPLIFY_TEMPLATES;
      if(opts.tag){
        const f=pool.filter(t=>t.tags.includes(opts.tag));
        if(f.length) pool=f;
      }
      const tpl=pick(pool);
      const [x,y,z]=pickAtoms(3).map(A);
      const {give,want}=tpl.make(x,y,z);
      return {type, tpl, give, want, prompt:tpl.prompt};
    }
    case 'evaluate': {
      const ast=freshRename(parseFormula(pick(EVAL_EXPRS)));
      const atoms=atomList(ast);
      const env={}; atoms.forEach(a=>env[a]=rnd()<0.5);
      return {type, ast, atoms, env, truth:evl(ast,env)};
    }
    case 'table': {
      const ast=freshRename(parseFormula(pick(TABLE_EXPRS)));
      const atoms=atomList(ast);
      return {type, ast, atoms, rows:rowsFor(atoms), truthCol:rowsFor(atoms).map(e=>evl(ast,e))};
    }
    case 'law': {
      const inst=pick(LAW_INSTANCES);
      const others=LAW_NAMES.filter(n=>n!==inst.law);
      for(let i=others.length-1;i>0;i--){ const j=ri(i+1); [others[i],others[j]]=[others[j],others[i]]; }
      const options=[inst.law, ...others.slice(0,3)];
      for(let i=options.length-1;i>0;i--){ const j=ri(i+1); [options[i],options[j]]=[options[j],options[i]]; }
      return {type, inst, options, answer:options.indexOf(inst.law)};
    }
    case 'argument': {
      const tpl=pick(ARG_TEMPLATES);
      const all=B('and', tpl.prem.map(parseFormula).reduce((a,b)=>B('and',a,b)), parseFormula(tpl.concl));
      const atoms=atomList(all);
      const fresh=pickAtoms(atoms.length);
      const map={}; atoms.forEach((a,i)=>map[a]=fresh[i]);
      const premises=tpl.prem.map(s=>renameAtoms(parseFormula(s),map));
      const conclusion=renameAtoms(parseFormula(tpl.concl),map);
      return {type, tpl, premises, conclusion, valid:tpl.valid};
    }
  }
}

function ceSentence(give, userAst){
  const ce=counterexamples(give, userAst, 1);
  if(!ce.length) return '';
  const atoms=atomList(give, userAst);
  return '<p>See for yourself — when '+esc(envSentence(ce[0].env, atoms))+
    ': the original comes out <b>'+(ce[0].vx?'T':'F')+'</b> but yours comes out <b>'+
    (ce[0].vy?'T':'F')+'</b>, so they cannot be the same statement.</p>';
}
function gradeSimplify(ex, src){
  let user;
  try{ user=parseFormula(src); }
  catch(e){ return {retry:true, html:'<p><b>I can’t read that yet:</b> '+esc(e.message)+'</p>'}; }
  const {give, want, tpl}=ex;

  if(eq(user, give))
    return {retry:true, html:'<p>That’s the question restated — apply a law to change its form.</p>'};
  if(tpl.accept==='exact'){
    if(eq(user, want))
      return {correct:true, bugs:[], html:'<p><b>Exactly right.</b> '+esc(format(give))+' ⟿ '+esc(format(want))+'</p>'};
    if(tpl.distractors){
      const [x,y]=[ex.give.a, ex.give.b];
      for(const d of tpl.distractors){
        if(eq(user, d.form(x,y)))
          return {correct:false, bugs:d.bug?[d.bug]:[], html:'<p>'+esc(d.msg)+'</p>'+
            (d.bug?bugFeedbackHTML(mistakeInfo(d.bug)):'')};
      }
    }
    return {correct:false, bugs:[], html:'<p>Not the requested form. Expected: <span class="formula">'+
      esc(format(want))+'</span>.</p>'};
  }
  // semantic acceptance
  if(equivalent(user, give)){
    if(tpl.forbid){
      for(const op of tpl.forbid) if(usesOp(user,op))
        return {retry:true, html:'<p><b>Right value, wrong form</b> — your formula is equivalent, '+
          'but it still contains <b>'+SYM[op]+'</b>, which this question asks you to eliminate.</p>'};
    }
    if(tpl.fully && nodeCount(user)>nodeCount(want)){
      return {correct:false, bugs:[], html:
        '<p><b>True so far</b> — your formula is equivalent, but it can still shrink. '+
        'Keep simplifying until you reach <span class="formula">'+esc(format(want))+'</span>.</p>'};
    }
    let h='<p><b>Correct!</b> Your answer is logically equivalent to the original.</p>';
    if(format(user)!==format(want))
      h+='<p class="muted small">The textbook form is <span class="formula">'+esc(format(want))+'</span> — yours says the same thing.</p>';
    return {correct:true, bugs:[], html:h};
  }
  // wrong: diagnose
  const d=diagnose(give, user);
  let h='<p><b>Not equivalent.</b></p>';
  const bugs=[];
  if(d){ h+=bugFeedbackHTML(d.bug); bugs.push(d.bug.id); }
  h+=ceSentence(give, user);
  h+='<p class="muted small">Looking for: <span class="formula">'+esc(format(want))+'</span></p>';
  return {correct:false, bugs, html:h};
}
function gradeEvaluate(ex, ans){
  const {ast, env, atoms, truth}=ex;
  if(ans===truth){
    return {correct:true, bugs:[], html:'<p><b>Correct.</b> Step-by-step evaluation:</p>'+evalWalkHTML(ast,env)};
  }
  const candidates=MODELS.filter(m=>usesOp(ast,m.needs))
    .filter(m=>{ const v=evlModel(ast,env,m.ops); return v!==truth && v===ans; });
  let h='<p><b>Not quite — the value is '+(truth?'T':'F')+'.</b></p>';
  const bugs=[];
  if(candidates.length===1){
    const bug=mistakeInfo(candidates[0].bug);
    h+=bugFeedbackHTML(bug); bugs.push(bug.id);
  }
  h+='<p>Walk through it one connective at a time:</p>'+evalWalkHTML(ast,env);
  return {correct:false, bugs, html:h};
}
function gradeTable(ex, cells){
  const {ast, rows, truthCol, atoms}=ex;
  const wrong=[];
  truthCol.forEach((t,i)=>{ if(cells[i]!==t) wrong.push(i); });
  if(!wrong.length)
    return {correct:true, bugs:[], html:'<p><b>Perfect column!</b> That is exactly the truth table of <span class="formula">'+esc(format(ast))+'</span>.</p>'};
  const bugs=[];
  let h='<p><b>'+wrong.length+(wrong.length===1?' row is':' rows are')+' off</b> (marked in red).</p>';
  for(const m of MODELS.filter(m=>usesOp(ast,m.needs))){
    const col=rows.map(e=>evlModel(ast,e,m.ops));
    if(col.every((v,i)=>v===cells[i]) && col.some((v,i)=>v!==truthCol[i])){
      const bug=mistakeInfo(m.bug);
      h+=bugFeedbackHTML(bug); bugs.push(bug.id);
      break;
    }
  }
  h+='<p>Correct table for comparison:</p>'+ttableHTML([ast]);
  return {correct:false, bugs, html:h};
}
function gradeLaw(ex, idx){
  const {inst, options, answer}=ex;
  if(idx===answer)
    return {correct:true, bugs:[], html:'<p><b>Right:</b> '+esc(inst.law)+'.</p>'};
  return {correct:false, bugs:[], html:'<p>This one is <b>'+esc(inst.law)+'</b>, not '+esc(options[idx])+
    '. Pattern: <span class="formula">'+esc(inst.from)+' ≡ '+esc(inst.to)+'</span></p>'};
}
function gradeArgument(ex, saysValid){
  const {premises, conclusion, valid, tpl}=ex;
  const res=argumentCheck(premises, conclusion);
  if(saysValid===valid){
    let h='<p><b>Correct'+(valid?' — valid':' — invalid')+'.</b> ';
    if(valid) h+='This is the classic form <b>'+esc(tpl.rule)+'</b>: in every row where all premises are true, the conclusion is true as well.</p>';
    else {
      const env=res.counterexamples[0];
      h+='Counterexample: '+esc(envSentence(env,res.atoms))+' makes every premise true but the conclusion false.</p>';
    }
    return {correct:true, bugs:[], html:h};
  }
  const bugs=[]; let h;
  if(valid){
    const bug=mistakeInfo('valid-missed'); bugs.push(bug.id);
    h='<p><b>It is actually valid</b> — this is '+esc(tpl.rule)+'. '+esc(bug.tip)+'</p>';
  } else {
    const bug=mistakeInfo(tpl.bug); bugs.push(bug.id);
    const env=res.counterexamples[0];
    h='<p><b>It is actually invalid.</b></p>'+bugFeedbackHTML(bug)+
      '<p>Counterexample: '+esc(envSentence(env,res.atoms))+' — all premises true, conclusion false:</p>'+
      ttableHTML([...premises, conclusion], {hlPred:e=>premises.every(p=>evl(p,e))&&!evl(conclusion,e)});
  }
  return {correct:false, bugs, html:h};
}

/* Pick the next exercise for smart practice, weighted toward weak spots. */
function smartPick(stats, topMistakeId){
  if(topMistakeId && rnd()<0.45){
    const info=mistakeInfo(topMistakeId);
    if(info.practice) return {type:info.practice.type, tag:info.practice.tag, targeted:info};
  }
  const types=Object.keys(EXERCISE_TYPES);
  const weights=types.map(t=>{
    const s=stats[t]||{n:0,c:0};
    const acc=s.n?s.c/s.n:0.55;
    return Math.max(0.15, 1.25-acc);
  });
  let r=rnd()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<types.length;i++){ r-=weights[i]; if(r<=0) return {type:types[i]}; }
  return {type:types[0]};
}

const LAWS_REF=[
  {name:'Identity',            forms:['A ∧ ⊤ ≡ A','A ∨ ⊥ ≡ A']},
  {name:'Domination',          forms:['A ∨ ⊤ ≡ ⊤','A ∧ ⊥ ≡ ⊥']},
  {name:'Idempotence',         forms:['A ∧ A ≡ A','A ∨ A ≡ A']},
  {name:'Double negation',     forms:['¬¬A ≡ A']},
  {name:'Commutativity',       forms:['A ∧ B ≡ B ∧ A','A ∨ B ≡ B ∨ A']},
  {name:'Associativity',       forms:['(A ∧ B) ∧ C ≡ A ∧ (B ∧ C)','(A ∨ B) ∨ C ≡ A ∨ (B ∨ C)']},
  {name:'Distributivity',      forms:['A ∧ (B ∨ C) ≡ (A∧B) ∨ (A∧C)','A ∨ (B ∧ C) ≡ (A∨B) ∧ (A∨C)']},
  {name:'De Morgan’s laws',    forms:['¬(A ∧ B) ≡ ¬A ∨ ¬B','¬(A ∨ B) ≡ ¬A ∧ ¬B']},
  {name:'Absorption',          forms:['A ∧ (A ∨ B) ≡ A','A ∨ (A ∧ B) ≡ A']},
  {name:'Complement',          forms:['A ∧ ¬A ≡ ⊥','A ∨ ¬A ≡ ⊤']},
  {name:'Material implication',forms:['A → B ≡ ¬A ∨ B']},
  {name:'Contrapositive',      forms:['A → B ≡ ¬B → ¬A']},
  {name:'Negated conditional', forms:['¬(A → B) ≡ A ∧ ¬B']},
  {name:'Biconditional',       forms:['A ↔ B ≡ (A→B) ∧ (B→A)','¬(A ↔ B) ≡ A ⊕ B']},
  {name:'Exclusive or',        forms:['A ⊕ B ≡ (A∨B) ∧ ¬(A∧B)']}
];
function lawsTableHTML(subset){
  let h='<table class="lawtable"><tr><th>Law</th><th>Pattern</th></tr>';
  for(const l of LAWS_REF){
    if(subset && !subset.includes(l.name)) continue;
    h+='<tr><td><b>'+esc(l.name)+'</b></td><td class="formula">'+l.forms.map(esc).join('<br>')+'</td></tr>';
  }
  return h+'</table>';
}

const LESSONS=[
{n:1, title:'Statements and truth values', blurb:'What logic talks about',
 html:`
<p>Formal logic studies <b>arguments whose strength comes from their shape</b>, not from what they happen to be about. To get there, we first pin down the bricks everything is built from.</p>
<p>A <b>proposition</b> (or <i>statement</i>) is a sentence that is definitely either <b>true</b> or <b>false</b> — even if we don’t currently know which.</p>
<ul>
<li>“7 is prime.” — a proposition (true).</li>
<li>“Paris is the capital of Japan.” — a proposition (false).</li>
<li>“There is life outside our galaxy.” — a proposition (we just don’t know its value).</li>
<li>“Close the door!” / “What time is it?” — <i>not</i> propositions: commands and questions aren’t true or false.</li>
</ul>
<p>In symbols we abbreviate whole propositions with capital letters: <span class="formula">P</span>, <span class="formula">Q</span>, <span class="formula">R</span>… We also keep two special constants: <span class="formula">⊤</span> (always true) and <span class="formula">⊥</span> (always false).</p>
<p>Complex sentences are built by joining simple ones with <b>connectives</b> — and, or, not, if…then. That’s the whole game: the next lessons introduce one connective at a time, each defined completely by a small table of truth values.</p>
<div class="takeaway"><h4>Key idea</h4>In propositional logic a sentence has exactly one of two values, <b>T</b> or <b>F</b>, and the value of a big sentence is computed mechanically from the values of its parts.</div>`,
 quiz:[
  {q:'Which of these is a proposition?',
   choices:[{t:'“Please pass the salt.”'},{t:'“The number 12 is divisible by 3.”'},{t:'“How far is the moon?”'},{t:'“Wow!”'}],
   a:1, explain:'Only the second one makes a claim that is true or false (it’s true). Commands, questions and exclamations have no truth value.'},
  {q:'A proposition must…',
   choices:[{t:'be known to be true'},{t:'be either true or false'},{t:'contain a verb and a number'},{t:'be about mathematics'}],
   a:1, explain:'We don’t need to KNOW the value — it just has to have one.'},
  {q:'Which symbol always stands for a false statement?',
   choices:[{t:'⊤'},{t:'P'},{t:'⊥'},{t:'Q'}],
   a:2, explain:'⊥ (“bottom”) is the constant falsehood; ⊤ (“top”) is the constant truth; P and Q can be either.'}
 ]},

{n:2, title:'NOT, AND, OR', blurb:'The three basic connectives',
 html:`
<p>Each connective is <i>defined</i> by its truth table — there is nothing more to it than the table.</p>
<h3>¬ — negation (“not”)</h3>
<p><span class="formula">¬P</span> flips the value of <span class="formula">P</span>.</p>
<div data-ttable="¬P"></div>
<h3>∧ — conjunction (“and”)</h3>
<p><span class="formula">P ∧ Q</span> is true only when <b>both</b> parts are true.</p>
<div data-ttable="P ∧ Q"></div>
<h3>∨ — disjunction (“or”)</h3>
<p><span class="formula">P ∨ Q</span> is true when <b>at least one</b> part is true — including when both are.</p>
<div data-ttable="P ∨ Q"></div>
<div class="mistakebox"><h4>⚠ The classic trap: exclusive “or”</h4>
In everyday speech “soup or salad” usually means <i>not both</i>. Logical <span class="formula">∨</span> is <b>inclusive</b>: <span class="formula">P ∨ Q</span> is happily true when both hold. When you really mean “exactly one”, logic has a separate symbol, <span class="formula">⊕</span> (Lesson 4).</div>
<div class="takeaway"><h4>Key idea</h4>∧ demands both; ∨ demands at least one; ¬ flips. Memorise the three little tables — everything else is built from them.</div>`,
 quiz:[
  {q:'P is true and Q is true. What is P ∨ Q?',
   choices:[{t:'True'},{t:'False', bug:'or-as-xor'}],
   a:0, explain:'Inclusive or: true when at least one side is true — both being true is fine.'},
  {q:'P is false, Q is true. What is ¬P ∧ Q?',
   choices:[{t:'True'},{t:'False'}],
   a:0, explain:'¬P is T (since P is F), and T ∧ T is T.'},
  {q:'When is P ∧ Q false?',
   choices:[{t:'Only when both parts are false'},{t:'Whenever at least one part is false'},{t:'Only when P is false'}],
   a:1, explain:'One false part is enough to sink a conjunction.'}
 ]},

{n:3, title:'IF … THEN (→)', blurb:'The connective everyone trips on',
 html:`
<p><span class="formula">P → Q</span> reads “if P then Q”. P is the <b>antecedent</b> (the if-part), Q the <b>consequent</b> (the then-part). Its table surprises almost everyone at first:</p>
<div data-ttable="P → Q"></div>
<p>Think of it as a <b>promise</b>: “If it rains, I’ll bring you an umbrella.”</p>
<ul>
<li>It rains, umbrella arrives — promise kept (<b>T</b>).</li>
<li>It rains, no umbrella — promise <b>broken</b>. This is the <b>only</b> broken row (<b>F</b>).</li>
<li>It doesn’t rain — whatever I do, you can’t call me a liar. The promise stands (<b>T</b>, called <i>vacuously true</i>).</li>
</ul>
<p>So <span class="formula">P → Q</span> is false in exactly one case: <b>P true, Q false</b>. It makes no claim that P ever happens, and no claim that Q was caused by P.</p>
<div class="mistakebox"><h4>⚠ Two traps</h4>
<b>1.</b> Reading <span class="formula">P → Q</span> as “P and Q both happen” — no: when P is false the implication is already true.<br>
<b>2.</b> Assuming it also works backwards (“…then if Q, P”) — that’s a different statement, the <i>converse</i> (Lesson 8).</div>
<p>Try flipping values yourself: <button class="btn small" data-solve="P → Q">open P → Q in the solver</button></p>
<div class="takeaway"><h4>Key idea</h4>An implication is only false when the if-part is true and the then-part is false. False antecedent ⇒ implication true, automatically.</div>`,
 quiz:[
  {q:'P is false, Q is true. What is P → Q?',
   choices:[{t:'True'},{t:'False', bug:'imp-as-and'}],
   a:0, explain:'The if-part never happened, so the promise wasn’t broken: vacuously true.'},
  {q:'P is false, Q is false. What is P → Q?',
   choices:[{t:'True'},{t:'False', bug:'imp-as-and'}],
   a:0, explain:'Again vacuously true — only T → F breaks an implication.'},
  {q:'P → Q is false exactly when…',
   choices:[{t:'P is true and Q is false'},{t:'P is false and Q is true'},{t:'P and Q are both false'},{t:'P and Q differ'}],
   a:0, explain:'One broken-promise row: antecedent true, consequent false.'}
 ]},

{n:4, title:'IFF (↔) and XOR (⊕)', blurb:'Sameness and difference',
 html:`
<p>Two more connectives complete the standard set.</p>
<h3>↔ — biconditional (“if and only if”)</h3>
<p><span class="formula">P ↔ Q</span> is true when the two sides have the <b>same</b> value.</p>
<div data-ttable="P ↔ Q"></div>
<p>It is literally a promise in <b>both directions</b>: <span class="formula">P ↔ Q ≡ (P → Q) ∧ (Q → P)</span>.</p>
<h3>⊕ — exclusive or</h3>
<p><span class="formula">P ⊕ Q</span> is true when the values <b>differ</b> — “exactly one of the two”.</p>
<div data-ttable="P ⊕ Q"></div>
<p>Notice the symmetry: <span class="formula">⊕</span> is the exact opposite of <span class="formula">↔</span>, i.e. <span class="formula">P ⊕ Q ≡ ¬(P ↔ Q)</span>. Compare them side by side: <button class="btn small" data-solve="P ⊕ Q == ¬(P ↔ Q)">check it in the solver</button></p>
<div class="mistakebox"><h4>⚠ Trap</h4>Treating <span class="formula">↔</span> as a one-way street. “You get dessert if and only if you finish dinner” also rules out dessert <i>without</i> dinner. Both directions, always.</div>
<div class="takeaway"><h4>Key idea</h4>↔ = same value (two implications at once). ⊕ = different values. Each is the negation of the other.</div>`,
 quiz:[
  {q:'P is true, Q is false. What is P ↔ Q?',
   choices:[{t:'True'},{t:'False'}],
   a:1, explain:'The sides differ, so the biconditional is false.'},
  {q:'P and Q are both true. What is P ⊕ Q?',
   choices:[{t:'True'},{t:'False'}],
   a:1, explain:'Exclusive or wants exactly ONE true side — both true makes it false.'},
  {q:'P ↔ Q says the same thing as…',
   choices:[{t:'(P → Q) ∧ (Q → P)'},{t:'P → Q', bug:'iff-one-way'},{t:'P ∧ Q'},{t:'P ∨ Q'}],
   a:0, explain:'A biconditional is two implications, one in each direction.'}
 ]},

{n:5, title:'Truth tables and precedence', blurb:'Reading and building formulas',
 html:`
<p>With several connectives in one formula, two skills matter: knowing <b>which connective applies first</b>, and building the table <b>column by column</b>.</p>
<h3>Precedence</h3>
<p>From tightest to loosest: <span class="formula">¬</span> &nbsp;→&nbsp; <span class="formula">∧</span> &nbsp;→&nbsp; <span class="formula">∨, ⊕</span> &nbsp;→&nbsp; <span class="formula">→</span> &nbsp;→&nbsp; <span class="formula">↔</span></p>
<ul>
<li><span class="formula">¬P ∨ Q</span> means <span class="formula">(¬P) ∨ Q</span>, not <span class="formula">¬(P ∨ Q)</span>.</li>
<li><span class="formula">P ∧ Q ∨ R</span> means <span class="formula">(P ∧ Q) ∨ R</span>.</li>
<li>Arrows chain to the right: <span class="formula">P → Q → R</span> means <span class="formula">P → (Q → R)</span>.</li>
</ul>
<p>When in doubt — parenthesise. Extra brackets are never wrong.</p>
<h3>Building a table</h3>
<p>A formula with <i>n</i> different letters needs <b>2<sup>n</sup></b> rows. Work from the smallest parts outwards, one column per sub-formula:</p>
<div data-ttable-sub="¬P ∨ (Q ∧ P)"></div>
<p>The solver does this for any formula — with all intermediate columns: <button class="btn small" data-solve="(P → Q) ∧ (Q → R)">try one with 3 letters</button></p>
<div class="takeaway"><h4>Key idea</h4>¬ binds tightest, ↔ loosest, arrows group rightwards. 2 letters ⇒ 4 rows, 3 letters ⇒ 8 rows — every combination, every time.</div>`,

  {q:'Without extra brackets, ¬P ∨ Q means…',
   choices:[{t:'(¬P) ∨ Q'},{t:'¬(P ∨ Q)'}],
   a:0, explain:'¬ grabs only the letter next to it; it binds tighter than ∨.'},
  {q:'How many rows does a truth table for a formula with letters P, Q and R have?',
   choices:[{t:'3'},{t:'6'},{t:'8'},{t:'9'}],
